<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src https://script.google.com https://script.googleusercontent.com; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#f5b800">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<title>Parte diario de obra</title>
<style>
:root{--ink:#14202b;--hv:#f5b800;--paper:#eef0f2;--line:#c9d0d6;--ok:#1f7a3d;--err:#b3261e;--mut:#51606d}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--paper);color:var(--ink);font-size:17px;padding-bottom:84px}
header{background:var(--hv);padding:10px 16px;display:flex;justify-content:space-between;align-items:center;gap:8px}
header h1{font-size:18px;margin:0}
#red{font-size:13px;font-weight:700}
main{max-width:640px;margin:auto;padding:14px}
h2{font-size:20px;margin:6px 0 4px}
.guia{margin:0 0 12px;color:var(--mut);font-size:15px}
.card{background:#fff;border:1px solid var(--line);border-radius:6px;padding:12px;margin-bottom:12px}
.row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;align-items:flex-end}
.row>*{flex:1;min-width:120px}
label{font-size:14px;color:var(--mut);display:block;margin-bottom:3px}
input,select{width:100%;padding:12px;font-size:17px;border:1px solid #8794a0;border-radius:6px;background:#fff;color:var(--ink)}
input:focus,select:focus,button:focus-visible{outline:3px solid var(--hv);outline-offset:1px}
button{padding:14px 16px;font-size:17px;font-weight:700;border:0;border-radius:6px;background:var(--ink);color:#fff;width:100%}
button.sec{background:#dde2e6;color:var(--ink)}
button.link{background:none;color:var(--ink);text-decoration:underline;width:auto;padding:4px;font-weight:400;font-size:15px}
.chk{display:flex;align-items:center;gap:10px;font-size:18px;color:var(--ink);margin:0;font-weight:700}
.chk input{width:28px;height:28px}
.aviso{padding:10px 12px;border-radius:6px;margin:0 0 12px;font-size:16px;border:1px solid var(--line);background:#fff}
.aviso.ok{border-color:var(--ok);color:var(--ok)}.aviso.err{border-color:var(--err);color:var(--err)}
.off{opacity:.5}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.chip{width:auto;min-width:64px;padding:10px 12px;background:#fff;color:var(--ink);border:2px solid var(--ink);font-weight:600}
.chip.on{background:var(--ink);color:#fff}
.total{margin-top:10px;font-size:19px;font-weight:700}
.n{display:inline-block;background:var(--hv);border-radius:50%;width:30px;height:30px;line-height:30px;text-align:center;font-weight:800;margin-right:6px}
.fotos{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fotos img{width:100%;border-radius:4px;display:block}
.prob{display:flex;gap:8px;align-items:center;justify-content:space-between;margin:6px 0;color:var(--err);font-size:16px}
.prob button{width:auto;padding:8px 12px;font-size:15px}
small{color:var(--mut)}
#barra{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:10px 14px;display:flex;gap:10px}
#barra button{flex:1}
.err-c input,.err-c select{border:3px solid var(--err);background:#fdecea}
.err-c label{color:var(--err);font-weight:700}
.err-c .chip{border-color:var(--err)}
.card.err-c{border:3px solid var(--err);background:#fdecea}
.msgerr{color:var(--err);font-weight:700;display:block;margin-top:3px}
.req{color:var(--err)}
.li{display:flex;gap:8px;align-items:center;justify-content:space-between;border-top:1px solid var(--line);padding:10px 0;flex-wrap:wrap}
.li b{display:block}
.tag{font-size:12px;color:#fff;background:var(--mut);border-radius:4px;padding:2px 6px;margin-left:6px}
.tag.hoy{background:var(--ok)}.tag.pend{background:#b36b00}
.li button{width:auto;padding:10px 12px;font-size:15px}
[hidden]{display:none!important}
</style>
</head>
<body>
<header><h1>Parte diario de obra</h1><span id="red"></span></header>
<main>
  <div id="aviso" class="aviso" hidden></div>

  <section id="login" class="card">
    <label for="llave">Escribe tu llave</label>
    <input id="llave" type="text" autocapitalize="characters" autocomplete="off">
    <div class="row"><button id="btnIngresar">Entrar</button></div>
    <p><small>La primera vez necesitas señal. Después funciona sin internet.</small></p>
  </section>

  <section id="app" hidden>
    <div class="card"><b id="saludo"></b> · <span id="fecha"></span><br><small id="info"></small><br>
      <button class="link" id="btnBib">← Mis partes</button> <button class="link" id="btnSalir">Cambiar de usuario</button></div>
    <div id="progreso" class="guia"></div>
    <div id="contenido"></div>
  </section>

  <section id="biblio" hidden></section>
  <section id="listo" hidden></section>
</main>
<nav id="barra" hidden><button class="sec" id="atras">Atrás</button><button id="sig">Siguiente</button></nav>
<datalist id="dl-act"></datalist>
<datalist id="dl-cargo"><option value="Oficial"><option value="Ayudante"><option value="Operador"><option value="Tráfico"><option value="Conductor"><option value="Topógrafo"><option value="Inspector SST"></datalist>

<script src="vendor/jspdf.umd.min.js"></script>
<script src="vendor/jspdf.plugin.autotable.min.js"></script>
<script src="comun.js"></script>
<script src="pdf.js"></script>
<script>
'use strict';
const API = 'https://script.google.com/macros/s/AKfycbz6LjPHWbh_vLcYhwSvYFp8tMN737nX-hJUPiX6vOvLb_3tEAyH9zeCC_4pqNSPRz9O1w/exec';
const MAXACT = 6, MAXFOTOS = 15;
const PASOS = ['Datos del día', 'Actividades', 'Personal', 'Máquinas', 'Materiales', 'Fotos', 'Pedir para mañana', 'Revisar y guardar'];
const $ = id => document.getElementById(id);
const hoy = () => new Date().toLocaleDateString('sv-SE');
const uid = () => 'f' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);

function h(tag, props, ...kids) {
  const e = document.createElement(tag);
  for (const k in (props || {})) {
    const v = props[k];
    if (k === 'class') e.className = v;
    else if (k.slice(0, 2) === 'on') e[k] = v;
    else if (k === 'value') e.value = v;
    else if (k === 'checked') e.checked = !!v;
    else if (v !== false && v !== null && v !== undefined) e.setAttribute(k, v);
  }
  kids.flat().forEach(c => {
    if (c === null || c === undefined || c === false) return;
    e.appendChild(typeof c === 'object' ? c : document.createTextNode(String(c)));
  });
  return e;
}

/* ---------- almacenamiento en el teléfono ---------- */
const kv = (() => {
  let dbp;
  const open = () => dbp || (dbp = new Promise((res, rej) => {
    const r = indexedDB.open('parte-diario', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('kv');
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  }));
  const tx = async (modo, fn) => {
    const db = await open();
    return new Promise((res, rej) => {
      const t = db.transaction('kv', modo);
      const rq = fn(t.objectStore('kv'));
      t.oncomplete = () => res(rq && rq.result);
      t.onerror = () => rej(t.error);
    });
  };
  return { get: k => tx('readonly', s => s.get(k)), set: (k, v) => tx('readwrite', s => s.put(v, k)), del: k => tx('readwrite', s => s.delete(k)) };
})();

/* ---------- estado ---------- */
let user = null, P = null, paso = 0, sugerencias = [], ultimoPdf = null, tBorr = null;

const nuevoParte = () => ({ fecha: hoy(), encabezado: { localizacion: '', pk: '' }, clima_sel: null, clima: [], actividades: [],
  personal: [], maquinas: [], materiales: [], fotos: [], solicitudes: [] });
const ultimoCC = () => { const t = [].concat(P.personal, P.maquinas, P.materiales); for (let i = t.length - 1; i >= 0; i--) if (t[i].c_costo) return t[i].c_costo; return ''; };
const nuevaActividad = () => ({ n: P.actividades.length + 1, descripcion: '', unidad: '', d1: '', d2: '', d3: '', descuentos: '0', factor: '1', obs: '' });
const nuevaPersona = () => ({ c_costo: ultimoCC(), nombre: '', cargo: '', inicio: '07:00', fin: '16:00', estado: 'PRESENTE', acts: [] });
const nuevaMaquina = () => ({ c_costo: ultimoCC(), nombre: '', recibo: '', inicio: '07:00', fin: '16:00', estado: 'OPERANDO', obs: '', acts: [] });
const nuevoMaterial = () => ({ c_costo: ultimoCC(), nombre: '', procedencia: 'Almacén', albaran: '', cantidad: '', unidad: 'M3', ubicacion: '', acts: [], fotos_ids: [], estado: 'USADO' });
const nuevaSolicitud = () => ({ tipo: 'Combustible', detalle: '', cantidad: '', unidad: '', cuando: 'MANANA', fecha: '', obs: '' });
let verErr = false, ERR = new WeakMap(), ultId = null;

// Convierte lo que viene del servidor o del teléfono en un parte completo. reiniciar = día nuevo con la cuadrilla de ayer.
function base(p, reiniciar) {
  const o = nuevoParte();
  if (!p) return o;
  o.fecha = reiniciar ? hoy() : (p.fecha || hoy());
  o.encabezado = { localizacion: (p.encabezado || {}).localizacion || '', pk: PD.pkDigitos((p.encabezado || {}).pk) };
  const L = x => Array.isArray(x) ? x : [];
  if (!reiniciar) {
    o.clima_sel = p.clima_sel || null; o.clima = L(p.clima); o.actividades = L(p.actividades);
    o.fotos = L(p.fotos).map(f => Object.assign({}, f, { acts: L(f.acts) })); o.solicitudes = L(p.solicitudes).map(q => Object.assign({ cuando: 'MANANA', fecha: '' }, q));
  }
  o.personal = L(p.personal).map(x => ({ c_costo: x.c_costo || '', nombre: x.nombre || '', cargo: x.cargo || '', inicio: x.inicio || '07:00', fin: x.fin || '16:00',
    estado: reiniciar ? 'PRESENTE' : (x.estado || 'PRESENTE'), acts: reiniciar ? [] : L(x.acts) }));
  o.maquinas = L(p.maquinas).map(x => ({ c_costo: x.c_costo || '', nombre: x.nombre || '', recibo: x.recibo || '', inicio: x.inicio || '07:00', fin: x.fin || '16:00',
    estado: reiniciar ? 'OPERANDO' : (x.estado || 'OPERANDO'), obs: reiniciar ? '' : (x.obs || ''), acts: reiniciar ? [] : L(x.acts) }));
  o.materiales = L(p.materiales).map(x => ({ c_costo: x.c_costo || '', nombre: x.nombre || '', procedencia: x.procedencia || 'Almacén', albaran: x.albaran || '', unidad: x.unidad || 'M3', ubicacion: x.ubicacion || '',
    cantidad: reiniciar ? '' : (x.cantidad === undefined ? '' : x.cantidad), acts: reiniciar ? [] : L(x.acts), fotos_ids: reiniciar ? [] : L(x.fotos_ids), estado: reiniciar ? 'NO USADO' : (x.estado || 'USADO') }));
  return o;
}

/* ---------- avisos y red ---------- */
function aviso(t, c) { const a = $('aviso'); a.textContent = t || ''; a.className = 'aviso ' + (c || ''); a.hidden = !t; if (t) window.scrollTo(0, 0); }
function estadoRed() { $('red').textContent = navigator.onLine ? 'Con señal' : 'Sin señal'; }

async function api(d) {
  const ctrl = new AbortController();
  const t = setTimeout(() => ctrl.abort(), 60000);
  try {
    const r = await fetch(API, { method: 'POST', body: JSON.stringify(d), signal: ctrl.signal });
    return await r.json();
  } finally { clearTimeout(t); }
}

/* ---------- ingreso ---------- */
async function guardarIngreso(x) {
  sugerencias = x.sugerencias || [];
  await kv.set('sug_' + x.llave, sugerencias);
  if (x.parte) await kv.set('roster', { llave: x.llave, parte: x.parte });
  await kv.set('bib_' + x.llave, x.biblioteca || []);
}
async function ingresar() {
  const l = $('llave').value.trim();
  if (!l) { aviso('Escribe tu llave.', 'err'); return; }
  if (!navigator.onLine) { aviso('La primera vez necesitas señal.', 'err'); return; }
  aviso('Entrando…');
  try {
    const r = await api({ accion: 'ingresar', llave: l });
    if (!r.ok && r.admin) { aviso('Eres administrador: te llevo al dashboard…', 'ok'); setTimeout(() => { location.href = 'admin.html'; }, 900); return; }
    if (!r.ok) { aviso(r.mensaje || 'Llave no válida', 'err'); return; }
    if (!user || user.llave !== r.llave) await kv.del('borrador');
    user = { llave: r.llave, nombre: r.nombre };
    await kv.set('user', user);
    await guardarIngreso(r);
    aviso('');
    await abrir(r);
  } catch (e) { aviso('No se pudo conectar. Intenta de nuevo.', 'err'); }
}

async function salir() {
  const cola = (await kv.get('cola')) || [];
  if (cola.length && !confirm('Hay ' + cola.length + ' parte(s) sin enviar. Se enviarán cuando haya señal. ¿Cambiar de usuario?')) return;
  await kv.del('user'); await kv.del('borrador');
  user = null; P = null;
  ['app', 'listo', 'barra', 'biblio'].forEach(i => $(i).hidden = true);
  $('login').hidden = false; $('llave').value = '';
}

let ult = null;
async function abrir(r) {
  ['login', 'listo', 'app', 'barra'].forEach(i => $(i).hidden = true);
  if (!r && navigator.onLine) {
    try { const x = await api({ accion: 'ingresar', llave: user.llave }); if (x.ok) { r = x; await guardarIngreso(x); } } catch (e) {}
  }
  ult = r;
  await biblioteca();
  sincronizar(false);
}

async function biblioteca() {
  aviso('');
  ['login', 'listo', 'app', 'barra'].forEach(i => $(i).hidden = true);
  $('biblio').hidden = false;
  const B = $('biblio');
  let lista = (await kv.get('bib_' + user.llave)) || [];
  if (navigator.onLine) {
    try { const x = await api({ accion: 'lista', llave: user.llave }); if (x.ok) { lista = x.biblioteca; await kv.set('bib_' + user.llave, lista); } } catch (e) {}
  }
  const cola = ((await kv.get('cola')) || []).filter(e => e.llave === user.llave);
  const h0 = hoy(), por = {};
  lista.forEach(x => { por[x.fecha] = { fecha: x.fecha, pdf: x.pdf, pend: false }; });
  cola.forEach(e => { const f = e.parte.fecha; por[f] = Object.assign(por[f] || { fecha: f, pdf: false }, { pend: true, local: !!e.pdf }); });
  const hayHoy = !!por[h0];
  B.textContent = '';
  B.appendChild(h('div', { class: 'card' }, h('b', {}, 'Hola, ' + user.nombre), h('br'), h('small', {}, PD.fechaLarga(h0)), h('br'),
    h('button', { class: 'link', onclick: salir }, 'Cambiar de usuario')));
  B.appendChild(h('button', { onclick: editarHoy }, hayHoy ? '✏️ Editar el parte de hoy' : '➕ Crear el parte de hoy'));
  const card = h('div', { class: 'card', style: 'margin-top:12px' }, h('b', {}, 'Mis partes'));
  if (hayHoy) card.appendChild(filaParte(por[h0], true));
  Object.keys(por).filter(f => f !== h0).sort().reverse().forEach(f => card.appendChild(filaParte(por[f], false)));
  if (!Object.keys(por).length) card.appendChild(h('p', {}, h('small', {}, 'Todavía no hay partes.')));
  B.appendChild(card);
}
function filaParte(x, esHoy) {
  const bs = h('div', { style: 'display:flex;gap:6px;flex-wrap:wrap' });
  if (esHoy) bs.appendChild(h('button', { onclick: editarHoy }, 'Editar'));
  if (x.pdf || x.local) {
    bs.appendChild(h('button', { class: 'sec', onclick: () => verDe(x.fecha) }, 'Ver'));
    bs.appendChild(h('button', { class: 'sec', onclick: () => compDe(x.fecha) }, 'Compartir'));
  }
  return h('div', { class: 'li' }, h('div', {}, h('b', {}, PD.fechaLarga(x.fecha), esHoy ? h('span', { class: 'tag hoy' }, 'HOY') : null,
    x.pend ? h('span', { class: 'tag pend' }, 'Sin enviar') : null), h('small', {}, esHoy ? 'Se puede editar' : 'Solo ver y compartir'), h('br'), h('small', {}, 'Código: ' + PD.codigoParte(x.fecha, user.llave))), bs);
}
function b64Blob(b) { const s = atob(b), u = new Uint8Array(s.length); for (let i = 0; i < s.length; i++) u[i] = s.charCodeAt(i); return new Blob([u], { type: 'application/pdf' }); }
function bajar(blob, nombre) {
  const u = URL.createObjectURL(blob); const a = h('a', { href: u, download: nombre }); document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(u), 60000);
}
async function pdfDe(fecha) {
  const e = ((await kv.get('cola')) || []).find(x => x.llave === user.llave && x.parte.fecha === fecha && x.pdf);
  if (e) return { blob: b64Blob(e.pdf), nombre: 'Parte_' + user.llave + '_' + fecha + '_' + e.hhmm + '_' + e.uid + '.pdf' };
  if (!navigator.onLine) { aviso('Para abrir este parte necesitas señal.', 'err'); return null; }
  aviso('Abriendo…');
  try {
    const r = await api({ accion: 'ver', llave: user.llave, fecha: fecha });
    if (!r.ok) { aviso(r.mensaje || 'No se pudo abrir.', 'err'); return null; }
    aviso(''); return { blob: b64Blob(r.pdf), nombre: r.nombre };
  } catch (e) { aviso('No se pudo abrir. Intenta de nuevo.', 'err'); return null; }
}
async function verDe(f) { const r = await pdfDe(f); if (r) bajar(r.blob, r.nombre); }
async function compDe(f) {
  const r = await pdfDe(f); if (!r) return;
  const file = new File([r.blob], r.nombre, { type: 'application/pdf' });
  try {
    if (navigator.canShare && navigator.canShare({ files: [file] })) await navigator.share({ files: [file], title: 'Parte diario ' + PD.fechaLarga(f) });
    else bajar(r.blob, r.nombre);
  } catch (e) { if (e && e.name !== 'AbortError') bajar(r.blob, r.nombre); }
}

async function cargarFotos() {
  const mio = P;
  if (!mio.fotos.some(f => f.url && !f.data) || !navigator.onLine) return;
  try {
    const r = await api({ accion: 'fotos', llave: user.llave, fecha: mio.fecha });
    if (!r.ok) return;
    for (const x of r.fotos) {
      const f = mio.fotos.find(q => q.id === x.id); if (!f || f.data) continue;
      f.data = x.data;
      await new Promise(res => { const i = new Image(); i.onload = () => { f.w = i.naturalWidth; f.h = i.naturalHeight; res(); }; i.onerror = res; i.src = x.data; });
    }
    if (P === mio) { cambio(); if (!$('app').hidden && (paso === 4 || paso === 5)) mostrar(); }
  } catch (e) {}
}

async function editarHoy() {
  const r = ult;
  verErr = false;
  ['biblio', 'listo'].forEach(i => $(i).hidden = true); $('app').hidden = false; $('barra').hidden = false;
  $('saludo').textContent = 'Hola, ' + user.nombre;
  $('fecha').textContent = PD.fechaLarga(hoy());
  const b = await kv.get('borrador');
  if (b && b.fecha === hoy() && b.llave === user.llave) {
    P = base(b.parte, false); paso = b.paso || 0;
    $('info').textContent = 'Seguimos con tu parte de hoy.';
  } else {
    paso = 0;
    const ro = await kv.get('roster');
    const mio = ro && ro.llave === user.llave ? ro.parte : null;
    if (r && r.ok && r.esHoy) { P = base(r.parte, false); P.fecha = hoy(); $('info').textContent = 'Ya había un parte de hoy. Puedes corregirlo.'; }
    else if (mio && mio.fecha === hoy()) { P = base(mio, false); $('info').textContent = 'Seguimos con tu parte de hoy.'; }
    else {
      const src = (r && r.ok && r.parte) ? r.parte : mio;
      P = base(src, true);
      $('info').textContent = src ? 'Cargamos tu gente y máquinas de ayer. Marca quién vino.' : 'Primer parte: agrega tu gente y máquinas.';
    }
  }
  sugerencias = (await kv.get('sug_' + user.llave)) || sugerencias || [];
  const dl = $('dl-act'); dl.textContent = '';
  sugerencias.forEach(q => dl.appendChild(h('option', { value: q.descripcion })));
  mostrar();
  cargarFotos();
}

function cambio() {
  clearTimeout(tBorr);
  tBorr = setTimeout(() => { if (user && P) kv.set('borrador', { fecha: P.fecha, llave: user.llave, parte: P, paso: paso }); }, 600);
}

/* ---------- piezas reutilizables ---------- */
const REQ = new Set(['localizacion', 'descripcion', 'nombre', 'c_costo', 'cantidad', 'detalle', 'd1', 'd2', 'd3', 'descuentos', 'factor', 'inicio', 'fin', 'fecha']);
function E(o, k) { return verErr && o && ERR.has(o) ? (ERR.get(o)[k] || '') : ''; }
function campo(etiqueta, obj, clave, o) {
  o = o || {};
  const er = E(obj, clave);
  const req = o.req !== undefined ? o.req : (REQ.has(clave) && !(clave === 'cantidad' && 'detalle' in obj));
  const msg = h('small', { class: 'msgerr' }, er);
  msg.hidden = !er;
  const caja = h('div', { class: er ? 'err-c' : '' });
  const inp = h('input', { type: o.type || 'text', inputmode: o.inputmode, placeholder: o.ph, list: o.list, autocomplete: 'off', value: obj[clave] == null ? '' : obj[clave],
    oninput: () => { obj[clave] = inp.value; if (o.alCambiar) o.alCambiar(); caja.classList.remove('err-c'); msg.hidden = true; cambio(); } });
  caja.append(h('label', {}, etiqueta, req ? h('span', { class: 'req' }, ' *') : null), inp, msg, o.ayuda ? h('small', {}, o.ayuda) : null);
  return caja;
}
function pkCampo() {
  const er = E(P.encabezado, 'pk');

function quitarActividad(i) {
  const n = P.actividades[i].n;
  P.actividades.splice(i, 1);
  P.actividades.forEach((a, k) => a.n = k + 1);
  [].concat(P.personal, P.maquinas, P.materiales, P.fotos).forEach(x => { x.acts = (x.acts || []).filter(v => v !== n).map(v => v > n ? v - 1 : v); });
}

/* ---------- fotos ---------- */
function comprimir(file) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const k = Math.min(1, 1280 / Math.max(img.naturalWidth, img.naturalHeight));
      const w = Math.round(img.naturalWidth * k), hh = Math.round(img.naturalHeight * k);
      const cv = document.createElement('canvas'); cv.width = w; cv.height = hh;
      cv.getContext('2d').drawImage(img, 0, 0, w, hh);
      URL.revokeObjectURL(url);
      res({ data: cv.toDataURL('image/jpeg', 0.65), w: w, h: hh });
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('foto')); };
    img.src = url;
  });
}
function botonFoto(texto, multiple, capture, alAgregar) {
  const inp = h('input', { type: 'file', accept: 'image/*', hidden: true });
  if (multiple) inp.multiple = true;
  if (capture) inp.setAttribute('capture', 'environment');
  inp.onchange = async () => {
    aviso('Preparando foto…');
    try { for (const f of Array.from(inp.files)) { const c = await comprimir(f); alAgregar(c); } aviso(''); }
    catch (e) { aviso('No se pudo leer la foto.', 'err'); }
    inp.value = '';
  };
  return h('div', {}, inp, h('button', { class: 'sec', type: 'button', onclick: () => inp.click() }, texto));
}
const miniFoto = (f, alQuitar) => h('div', {}, h('img', { src: f.data, alt: 'foto' }),

/* ---------- revisar ---------- */
function validar() {
  const pr = [], mk = new WeakMap();
  const m = (paso, t, o, ks, msg) => {
    pr.push({ paso: paso, t: t });
    if (o) { const e = mk.get(o) || {}; [].concat(ks).forEach(k => { e[k] = msg || 'Falta este dato'; }); mk.set(o, e); }
  };
  const hh = (a, b) => a && b && b > a;
  const e0 = P.encabezado;
  if (!e0.localizacion.trim()) m(0, 'Falta el lugar.', e0, 'localizacion');
  if (!/^\d{1,6}$/.test(e0.pk)) m(0, 'Falta el PK (solo números).', e0, 'pk', 'Escribe solo números');
  if (!P.clima_sel) m(0, 'Responde si hubo mal clima.', P, 'clima_sel', 'Elige Sí o No');
  if (P.clima_sel === 'si') P.clima.forEach(e => { if (!hh(e.inicio, e.fin)) m(0, 'Revisa la hora del clima.', e, ['inicio', 'fin'], 'Revisa la hora'); });
  if (!P.actividades.length) m(1, 'Agrega al menos una actividad.');
  P.actividades.forEach(a => {
    if (!a.descripcion.trim()) m(1, 'La actividad ' + a.n + ' no tiene nombre.', a, 'descripcion');
    if (!a.unidad) m(1, 'Elige en qué se mide la actividad ' + a.n + '.', a, 'unidad', 'Elige una opción');
    else if (isNaN(PD.cantidadActividad(a))) {
      const ks = [];
      for (let i = 1; i <= PD.dimsDe(a.unidad); i++) if (!(PD.num(a['d' + i]) > 0)) ks.push('d' + i);
      if (isNaN(PD.num(a.descuentos)) || PD.num(a.descuentos) < 0) ks.push('descuentos');
      if (!(PD.num(a.factor) > 0)) ks.push('factor');
      m(1, 'Revisa las medidas de la actividad ' + a.n + '.', a, ks.length ? ks : 'unidad', 'Revisa este número');
    }
  });
  P.personal.forEach(p => {
    if (!p.nombre.trim()) return m(2, 'Hay una persona sin nombre.', p, 'nombre');
    if (p.estado === 'AUSENTE') return;
    if (!p.c_costo.trim()) m(2, 'Falta el centro de costos de ' + p.nombre + '.', p, 'c_costo');
    if (!hh(p.inicio, p.fin)) m(2, 'Revisa las horas de ' + p.nombre + '.', p, ['inicio', 'fin'], 'Revisa la hora');
    if (P.actividades.length && !p.acts.length) m(2, '¿En qué actividad trabajó ' + p.nombre + '?', p, 'acts', 'Toca una actividad');
  });
  P.maquinas.forEach(x => {
    if (!x.nombre.trim()) return m(3, 'Hay una máquina sin nombre.', x, 'nombre');
    if (x.estado === 'NO ESTUVO') return;
    if (!x.c_costo.trim()) m(3, 'Falta el centro de costos de ' + x.nombre + '.', x, 'c_costo');
    if (!hh(x.inicio, x.fin)) m(3, 'Revisa las horas de ' + x.nombre + '.', x, ['inicio', 'fin'], 'Revisa la hora');
    if (P.actividades.length && x.estado !== 'VARADA' && !x.acts.length) m(3, '¿En qué actividad trabajó ' + x.nombre + '?', x, 'acts', 'Toca una actividad');
  });
  P.materiales.forEach(x => {
    if (x.estado === 'NO USADO') return;
    if (!x.nombre.trim()) return m(4, 'Hay un material sin nombre.', x, 'nombre');
    if (!(PD.num(x.cantidad) > 0)) m(4, 'Falta la cantidad de ' + x.nombre + '.', x, 'cantidad', 'Escribe la cantidad');
    if (!x.c_costo.trim()) m(4, 'Falta el centro de costos de ' + x.nombre + '.', x, 'c_costo');
    if (P.actividades.length && !x.acts.length) m(4, '¿En qué actividad se usó ' + x.nombre + '?', x, 'acts', 'Toca una actividad');
  });
  P.solicitudes.forEach(q => {
    if (!q.detalle.trim()) m(6, 'Hay un pedido sin explicar.', q, 'detalle');
    if (q.cuando === 'FECHA' && !(q.fecha && q.fecha >= hoy())) m(6, 'Elige la fecha del pedido (hoy o después).', q, 'fecha', 'Elige una fecha');
  });
  ERR = mk;
  return pr;
}
function pasoRevisar(c) {
  c.appendChild(h('h2', {}, 'Revisar y guardar'));
  const pr = validar();
  const pres = P.personal.filter(p => p.estado !== 'AUSENTE').length;
  c.appendChild(h('div', { class: 'card' },
    h('div', {}, P.actividades.length + ' actividades'), h('div', {}, pres + ' personas (' + (P.personal.length - pres) + ' no vinieron)'),
    h('div', {}, P.maquinas.length + ' máquinas'), h('div', {}, P.materiales.filter(x => x.estado !== 'NO USADO').length + ' materiales'),
    h('div', {}, P.fotos.length + ' fotos'), h('div', {}, P.solicitudes.length + ' pedidos para mañana')));
  if (pr.length) {
    const b = h('div', { class: 'card' }, h('b', {}, 'Falta arreglar esto:'));
    pr.forEach(x => b.appendChild(h('div', { class: 'prob' }, h('span', {}, x.t), h('button', { class: 'sec', onclick: () => { paso = x.paso; mostrar(); } }, 'Ir'))));
    c.appendChild(b);
  }
  c.appendChild(h('button', { onclick: guardar }, 'Guardar parte'));
}

/* ---------- guardar, PDF y envío ---------- */
function copia(o) { return JSON.parse(JSON.stringify(o)); }
function conPdf(parte) { return PD.generarParteDoc(parte, { llave: user.llave, encargado: user.nombre, residente: 'INGENIERO RESIDENTE AUXILIAR', control: 'CONTROL DE GESTION' }, window.jspdf.jsPDF); }

async function guardar() {
  verErr = true;
  const pr = validar();
  if (pr.length) { aviso('Falta arreglar ' + pr.length + ' cosa(s).', 'err'); paso = pr[0].paso; mostrar(); return; }
  aviso('Guardando…');
  const parte = copia(P);
  parte.actividades.forEach(a => { a.cantidad = PD.cantidadActividad(a); });
  parte.encabezado.pk = PD.formatoPK(parte.encabezado.pk);
  const hhmm = new Date().toLocaleTimeString('sv-SE', { hour: '2-digit', minute: '2-digit' }).replace(':', '');
  const uid8 = (Math.random().toString(36).slice(2, 7) + Date.now().toString(36).slice(-3)).toLowerCase();
  ultId = { hhmm: hhmm, uid: uid8 };
  let blob = null, b64 = null;
  try { const d = conPdf(parte); blob = d.output('blob'); b64 = d.output('datauristring').split(',')[1]; } catch (e) { console.error(e); }
  const id = parte.fecha + '_' + user.llave;
  const entrada = { id: id, ts: Date.now(), llave: user.llave, parte: parte, pdf: b64, hhmm: hhmm, uid: uid8, datosOk: false, pdfOk: !b64 };
  await mutarCola(c => c.filter(x => x.id !== id).concat([entrada]));
  await kv.set('roster', { llave: user.llave, parte: parte });
  ultimoPdf = blob;
  await kv.set('borrador', { fecha: P.fecha, llave: user.llave, parte: P, paso: paso });
  aviso('');
  mostrarListo(parte, !!blob);
  sincronizar(false);
}

async function mutarCola(fn) { const c = (await kv.get('cola')) || []; await kv.set('cola', fn(c)); }

function mostrarListo(parte, hayPdf) {
  $('app').hidden = true; $('barra').hidden = true; $('listo').hidden = false;
  const L = $('listo'); L.textContent = '';
  L.appendChild(h('div', { class: 'card' }, h('h2', {}, '✔ Parte guardado'), h('p', { id: 'estadoEnvio' }, 'Está guardado en el teléfono.')));
  if (hayPdf) {
    L.appendChild(h('div', { class: 'row' }, h('button', { onclick: compartir }, 'Compartir PDF por WhatsApp')));
    L.appendChild(h('div', { class: 'row' }, h('button', { class: 'sec', onclick: verPdf }, 'Ver / descargar PDF')));
  } else L.appendChild(h('p', { class: 'aviso err' }, 'No se pudo crear el PDF en este teléfono. Los datos sí quedaron guardados.'));
  L.appendChild(h('div', { class: 'row' }, h('button', { class: 'sec', id: 'btnEnviar', onclick: () => sincronizar(true) }, 'Enviar ahora')));
  L.appendChild(h('div', { class: 'row' }, h('button', { class: 'sec', onclick: biblioteca }, 'Ir a mis partes')));
  L.appendChild(h('div', { class: 'row' }, h('button', { class: 'sec', onclick: () => { $('listo').hidden = true; $('app').hidden = false; $('barra').hidden = false; paso = 7; mostrar(); } }, 'Corregir el parte')));
  pintarEstado();
}
async function pintarEstado() {
  const e = $('estadoEnvio'); if (!e) return;
  const c = (await kv.get('cola')) || [];
  const pend = c.some(x => x.id === (P ? P.fecha + '_' + (user && user.llave) : ''));
  e.textContent = pend ? 'Falta enviarlo a la oficina. Se enviará solo cuando haya señal.' : 'Ya se envió a la oficina. ✔';
}
function nombrePdf() {
  if (!ultId) ultId = { hhmm: new Date().toLocaleTimeString('sv-SE', { hour: '2-digit', minute: '2-digit' }).replace(':', ''), uid: (Math.random().toString(36).slice(2, 7) + Date.now().toString(36).slice(-3)).toLowerCase() };
  return 'Parte_' + user.llave + '_' + P.fecha + '_' + ultId.hhmm + '_' + ultId.uid + '.pdf';
}
async function obtenerPdf() {
  if (ultimoPdf) return ultimoPdf;
  const ro = await kv.get('roster');
  if (ro && ro.parte) { try { ultimoPdf = conPdf(ro.parte).output('blob'); } catch (e) {} }
  return ultimoPdf;
}
async function compartir() {
  if (!(await obtenerPdf())) return;
  const f = new File([ultimoPdf], nombrePdf(), { type: 'application/pdf' });
  try {
    if (navigator.canShare && navigator.canShare({ files: [f] })) await navigator.share({ files: [f], title: 'Parte diario ' + PD.fechaLarga(P.fecha) });
    else verPdf();
  } catch (e) { if (e && e.name !== 'AbortError') verPdf(); }
}
async function verPdf() {
  if (!(await obtenerPdf())) return;
  const u = URL.createObjectURL(ultimoPdf);
  const a = h('a', { href: u, download: nombrePdf() }); document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(u), 60000);
}

let sincronizando = false;
function payload(parte) {
  const p = copia(parte);
  p.fotos = p.fotos.map(f => ({ id: f.id, tipo: f.tipo, caption: f.caption, acts: f.tipo === 'ALBARAN' ? [] : (f.acts || []), url: f.url || '', data: f.url ? undefined : f.data }));
  return p;
}
async function sincronizar(manual) {
  if (sincronizando) return;
  const cola = (await kv.get('cola')) || [];
  if (!cola.length) { await pintarEstado(); return; }
  if (!navigator.onLine) { if (manual) aviso('No hay señal. Se enviará cuando haya.'); return; }
  sincronizando = true;
  if (manual) aviso('Enviando…');
  try {
    for (const e of cola) {
      if (!e.datosOk) {
        const r = await api({ accion: 'guardar', llave: e.llave, parte: payload(e.parte) });
        if (!r.ok && r.codigo !== 'PASADO') { aviso(r.mensaje || 'La oficina no aceptó el parte.', 'err'); break; }
        e.parte.fotos.forEach(f => { if (r.fotos && r.fotos[f.id]) f.url = r.fotos[f.id]; });
        if (P && P.fecha === e.parte.fecha) P.fotos.forEach(f => { if (r.fotos && r.fotos[f.id]) f.url = r.fotos[f.id]; });
        e.datosOk = true;
        await mutarCola(c => c.map(x => (x.id === e.id && x.ts === e.ts) ? e : x));
      }
      if (e.datosOk && !e.pdfOk) {
        const r2 = await api({ accion: 'pdf', llave: e.llave, fecha: e.parte.fecha, pdf: e.pdf, hhmm: e.hhmm, uid: e.uid });
        if (!r2.ok && r2.codigo !== 'PASADO') { aviso(r2.mensaje || 'No se pudo subir el PDF.', 'err'); break; }
        e.pdfOk = true;
      }
      if (e.datosOk && e.pdfOk) await mutarCola(c => c.filter(x => !(x.id === e.id && x.ts === e.ts)));
    }
    if (manual) aviso('');
  } catch (err) { if (manual) aviso('No se pudo enviar. Se reintentará cuando haya señal.', 'err'); }
  finally { sincronizando = false; pintarEstado(); if (user && !$('biblio').hidden) biblioteca(); }
}

/* ---------- arranque ---------- */
$('btnIngresar').onclick = ingresar;
$('llave').onkeydown = e => { if (e.key === 'Enter') ingresar(); };
$('btnSalir').onclick = salir;
$('btnBib').onclick = biblioteca;
$('atras').onclick = () => { if (paso > 0) { paso--; mostrar(); } };
$('sig').onclick = () => { if (paso < PASOS.length - 1) { paso++; mostrar(); } };
window.addEventListener('online', () => { estadoRed(); sincronizar(false); });
window.addEventListener('offline', estadoRed);
estadoRed();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
(async () => { try { user = await kv.get('user'); } catch (e) { user = null; } if (user) abrir(null); })();
</script>
