<style>

#barra{z-index:30}

body{padding-bottom:110px}
input.gran{font-size:30px;font-weight:800;text-align:center;padding:16px}
.opc{display:flex;gap:8px}.opc button{flex:1;font-size:17px;padding:14px 6px}
.opc button.sec.on{background:var(--ink);color:#fff}
.act{border:2px solid var(--line);border-left:8px solid var(--hv);border-radius:8px;padding:10px;margin-bottom:10px;background:#fff}
.act.par{border-left-color:#b36b00}.act.fue{border-left-color:#7b3fa0}
.act .tt{font-size:19px;font-weight:800;margin:0 0 6px;word-break:break-word}
.act .hh{font-size:22px;font-weight:800;color:var(--hv);margin:4px 0}
.cont{position:sticky;top:0;z-index:20;background:#fff3cd;border:2px solid var(--ink);border-radius:8px;padding:6px 10px;margin-bottom:10px;font-size:17px;font-weight:700;line-height:1.3}
.cont.mal{background:#fdecea;border-color:var(--err);color:var(--err)}.cont.bien{background:#e8f5ec;border-color:var(--ok);color:var(--ok)}
.mini{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0}.mini img{width:100px;height:100px;object-fit:cover;border-radius:6px;border:2px solid var(--line)}

@keyframes corre{0%{margin-left:-40%}100%{margin-left:100%}}
.rep{background:#fff;border:1px solid var(--line);border-left:6px solid var(--hv);border-radius:8px;padding:12px;margin-bottom:10px}
.rep.falta{border-left-color:#b36b00}.rep.mal{border-left-color:var(--err)}
.rep .t{font-size:21px;font-weight:800}.rep .s{font-size:16px;color:var(--mut);margin:2px 0 8px}
.rep .bs button{padding:12px 8px;font-size:17px;min-height:48px}

<body>
<header><img class="logo" src="logo_ccsn.png" alt="Consorcio Constructor Sabana Norte"><h1>Maquinaria</h1><span style="display:flex;align-items:center;gap:10px"><span id="red"></span><button type="button" id="recargar" class="ib" title="Recargar" aria-label="Recargar" onclick="location.reload()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 3v6h-6"/></svg></button><button type="button" id="salirTop" class="ib" hidden title="Cerrar sesión" aria-label="Cerrar sesión" onclick="cerrarSesion()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v10"/><path d="M18.4 6.6a9 9 0 1 1-12.8 0"/></svg></button></span></header>
<main>
  <div id="aviso" class="aviso" hidden></div>
  <div id="cargando" hidden role="alert" aria-live="assertive"><div class="caja"><div class="rueda"></div><b id="cargTxt">Cargando datos…</b><small>Espera un momento</small></div></div>
  <div id="bgpill" hidden role="status"><span class="rueda"></span><span>Actualizando datos…</span></div>
  <div id="envio" hidden role="alert" aria-live="assertive"><div class="caja"><div id="envIco" style="font-size:54px">📤</div><b id="envTit">Enviando el reporte…</b><div class="pb" id="envPb"><i></i></div><div id="envTxt" style="font-size:17px;color:#51606d">No cierres la aplicación hasta que termine.</div><div id="envBt" style="margin-top:14px;display:flex;flex-direction:column;gap:8px"></div></div></div>
  <section id="login" class="card" hidden>
    <img class="marca" src="logo.png" alt="Consorcio Constructor Sabana Norte">
    <label for="llave" style="font-size:20px;color:var(--ink)">🔑 Escribe tu llave</label>
    <input id="llave" type="text" autocapitalize="characters" autocomplete="off">
    <div class="row"><button id="btnIngresar" class="grande">Entrar</button></div>
    <p><small>La primera vez necesitas señal. Después funciona sin internet.</small></p>
  </section>
  <section id="inicio" hidden></section>
  <section id="form" hidden></section>
  <section id="visor" hidden></section>
</main>
<div id="barra" hidden></div>
<script>
'use strict';
const API = 'https://script.google.com/macros/s/AKfycbz6LjPHWbh_vLcYhwSvYFp8tMN737nX-hJUPiX6vOvLb_3tEAyH9zeCC_4pqNSPRz9O1w/exec';
const $ = id => document.getElementById(id);
const hoy = () => new Date().toLocaleDateString('sv-SE');
const sumDias = (f, n) => { const d = new Date(f + 'T12:00:00'); d.setDate(d.getDate() + n); return d.toLocaleDateString('sv-SE'); };
const fmtF = f => { const p = String(f).split('-'); return p.length === 3 ? p[2] + '/' + p[1] + '/' + p[0] : f; };
const num = v => { const s = String(v === undefined || v === null ? '' : v).trim().replace(',', '.'); const x = Number(s); return (s === '' || !isFinite(x)) ? NaN : x; };
const r2 = x => Math.round(x * 100) / 100;
const nh = x => String(r2(x)).replace('.', ',');
function h(tag, props, ...kids) {
  const e = document.createElement(tag);
  for (const k in (props || {})) {
    const v = props[k];
    if (k === 'class') e.className = v;
    else if (k.slice(0, 2) === 'on') e[k] = v;
    else if (k === 'value') e.value = v;
    else if (v !== false && v !== null && v !== undefined) e.setAttribute(k, v);
  }
  kids.flat().forEach(c => { if (c === null || c === undefined || c === false) return; e.appendChild(typeof c === 'object' ? c : document.createTextNode(String(c))); });
  return e;
}
let tCarga = null;
function carga(t) { clearTimeout(tCarga); const c = $('cargando'); if (!c) return; if (t) { $('cargTxt').textContent = t.replace(/…$/, '') + '…'; c.hidden = false; tCarga = setTimeout(() => { c.hidden = true; }, 60000); } else c.hidden = true; }
let bgN = 0;
function actualizando(on) { bgN = Math.max(0, bgN + (on ? 1 : -1)); const b = $('bgpill'); if (b) b.hidden = bgN === 0; }
function aviso(t, c, quieto) {
  const a = $('aviso'); const espera = !!t && !c && /…$/.test(t);
  a.textContent = espera ? '' : (t || ''); a.className = 'aviso ' + (c || ''); a.hidden = !t || espera; carga(espera ? t : '');
  if (t && !quieto) window.scrollTo(0, 0);
}
function pantalla(id) { $('salirTop').hidden = id === 'login' || !user; ['login', 'inicio', 'form'].forEach(i => $(i).hidden = i !== id); if (id !== 'form') $('barra').hidden = true; window.scrollTo(0, 0); }

/* ---------- almacenamiento en el teléfono ---------- */
const kv = (() => {
  let dbp;
  const open = () => dbp || (dbp = new Promise((res, rej) => { const r = indexedDB.open('maquinaria', 1); r.onupgradeneeded = () => r.result.createObjectStore('kv'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }));
  const tx = async (modo, fn) => { const db = await open(); return new Promise((res, rej) => { const t = db.transaction('kv', modo); const rq = fn(t.objectStore('kv')); t.oncomplete = () => res(rq && rq.result); t.onerror = () => rej(t.error); }); };
  const LS = 'mq_user';
  const lsGet = () => { try { return JSON.parse(localStorage.getItem(LS)); } catch (e) { return null; } };
  const lsSet = v => { try { if (v == null) localStorage.removeItem(LS); else localStorage.setItem(LS, JSON.stringify(v)); } catch (e) {} };
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
  return {
    get: async k => { let v; try { v = await tx('readonly', s => s.get(k)); } catch (e) { if (k !== 'user') throw e; } if (k === 'user' && !v) { v = lsGet(); if (v) { try { await tx('readwrite', s => s.put(v, k)); } catch (e) {} } } return v; },
    set: async (k, v) => { if (k === 'user') lsSet(v); return tx('readwrite', s => s.put(v, k)); },
    del: async k => { if (k === 'user') lsSet(null); return tx('readwrite', s => s.delete(k)); }
  };
})();
async function api(d, ms) {
  const ctrl = new AbortController(); const t = setTimeout(() => ctrl.abort(), ms || 60000);
  try { const r = await fetch(API, { method: 'POST', body: JSON.stringify(d), signal: ctrl.signal }); return await r.json(); } finally { clearTimeout(t); }
}

/* ---------- estado ---------- */
let user = null, DATOS = { maquinas: [], estructura: [], fija: '' }, REPS = [], COLA = [], sincronizando = false, GEN = 0;
const guardarReps = () => { GEN++; return kv.set('reps_' + user.llave, REPS); };
const guardarCola = () => kv.set('cola', COLA);
const asArr = x => Array.isArray(x) ? x : (x ? [x] : []);
const puedeEditar = r => r.fecha >= sumDias(hoy(), -3) || r.registrado === hoy();
const maqTxt = c => { const m = (DATOS.maquinas || []).find(x => String(x.cod) === String(c)); return m ? m.cod + ' · ' + m.tipo : (c || ''); };
const ALF = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
function nuevoId() { const a = new Uint8Array(5); crypto.getRandomValues(a); let s = ''; a.forEach(b => s += ALF[b % 32]); const id = 'MQ-' + hoy().slice(2).replace(/-/g, '') + '-' + s; return REPS.some(r => r.id === id) ? nuevoId() : id; }
const normAlb = x => { let t = String(x || '').toUpperCase().replace(/[^A-Z0-9]/g, ''); if (/^\d+$/.test(t)) t = t.replace(/^0+(?=\d)/, ''); return t; };

/* ---------- ingreso ---------- */
async function cargarLocal() {
  const d = await kv.get('datos'); if (d) DATOS = d;
  REPS = (await kv.get('reps_' + user.llave)) || [];
  COLA = (await kv.get('cola')) || [];
}
try { if (navigator.onLine) fetch(API, { method: 'POST', body: JSON.stringify({ accion: 'ping' }) }).catch(() => {}); } catch (e) {}
async function ingresar() {
  const l = $('llave').value.trim();
  if (!l) { aviso('Escribe tu llave.', 'err'); return; }
  if (!navigator.onLine) { aviso('La primera vez necesitas señal.', 'err'); return; }
  aviso('Entrando…');
  try {
    const r = await api({ accion: 'validar', llave: l, app: 'maquinaria' }, 30000);
    if (!r.ok) { aviso(r.admin ? 'Las llaves de administrador no crean reportes. Usa el dashboard.' : (r.mensaje || 'Llave no válida'), 'err'); return; }
    user = { llave: r.llave, nombre: r.nombre }; ULT_REF = 0;
    await kv.set('user', user); await cargarLocal();
    aviso(''); abrirInicio(); sincronizar();
  } catch (e) { aviso('No se pudo conectar. Intenta de nuevo.', 'err'); }
}
async function aplicarServidor(r) {
  DATOS = { maquinas: r.maquinas || DATOS.maquinas || [], estructura: r.estructura || DATOS.estructura || [], fija: r.fija || '' };
  await kv.set('datos', DATOS);
  const pend = new Set(COLA.filter(o => o.llave === user.llave).map(o => o.rid));
  const locales = REPS.filter(x => pend.has(x.id));
  REPS = (r.reportes || []).filter(x => !pend.has(x.id)).map(x => Object.assign(x, { llave: user.llave, nuevo: false })).concat(locales);
  await guardarReps();
}
let ULT_REF = 0;
async function refrescar(forzar) {
  if (!user || !navigator.onLine || sincronizando || COLA.some(o => !o.error)) return;
  if (!forzar && Date.now() - ULT_REF < 45000) return;
  const g = GEN;
  try {
    actualizando(true);

      } else {

      if (F.det.length > 1) card.appendChild(h('div', { style: 'text-align:right;margin-top:6px' }, h('button', { class: 'link', style: 'color:#b3261e', onclick: () => { F.det.splice(i, 1); pasoN(6); } }, '🗑 Quitar esta actividad')));
      C.appendChild(card);
    });
    C.appendChild(h('button', { class: 'sec', style: 'margin:4px 0 8px', onclick: () => { F.det.push(filaVacia()); pasoN(6); setTimeout(() => window.scrollTo(0, document.body.scrollHeight), 50); } }, '➕ Agregar otra actividad'));
    barraPasos(6, () => {
      const t2 = totales();
      for (let i = 0; i < F.det.length; i++) {
        const x = F.det[i], v = horaFila(x);
        if (!x.a) { pasoN(6); err('Elige qué hizo en la actividad ' + (i + 1) + '.'); return; }

      }
      { const ds = {}; F.det.forEach(x => { if (x.k !== 'X') ds[x.cc ? x.cc : 'F|' + x.a.toLowerCase()] = 1; }); if (Object.keys(ds).length > 6) { pasoN(6); err('Máximo 6 actividades distintas por reporte, como en el registro. Junta las que sean la misma.'); return; } }

function cambiarModo(m) {

  F.modo = m; F.det.forEach(x => { x.h = ''; x.d = ''; x.t = ''; }); pasoN(6);
}
function elegirActividad(i) {
  const est = DATOS.estructura || [], gr = {};
  est.forEach(e => { (gr[e.g || 'Otros'] = gr[e.g || 'Otros'] || []).push({ t: (e.cod ? e.cod + ' · ' : '') + e.a, sub: '', k: 'P', cc: e.cod, a: e.a, g: e.g }); });
  const grupos = Object.keys(gr).map(g => ({ titulo: '🏗 ' + g, ops: gr[g] }));
  grupos.push({ titulo: '⏸ La máquina estuvo parada (no es trabajo)', ops: PARADAS.map(p => ({ t: p, k: 'X', a: p })) });
  abrirLista('¿Qué hizo la máquina?', grupos, o => {
    const x = F.det[i];
    if (o.libre) { if (!o.t) { const v = prompt('Escribe la actividad que hizo (no está en la lista):'); if (!v || !v.trim()) return; o.t = v.trim(); } x.k = 'F'; x.cc = ''; x.a = o.t.slice(0, 80); x.g = ''; }
    else { x.k = o.k; x.cc = o.cc || ''; x.a = o.a; x.g = o.g || ''; }
    pasoN(6);
  }, 'No está en la lista (escribirla)');

const PARADAS = ['Espera (sin trabajo)', 'Varada (máquina dañada)', 'Varada del martillo', 'Lluvia', 'Otro motivo'];

/* ---------- guardar y enviar ---------- */
function envio(ico, tit, txt, barra, botones) {
  $('envio').hidden = false; $('envIco').textContent = ico; $('envTit').textContent = tit; $('envTxt').textContent = txt || ''; $('envPb').hidden = !barra;
  const b = $('envBt'); b.textContent = ''; (botones || []).forEach(x => b.appendChild(h('button', { class: x[2] || '', onclick: x[1] }, x[0])));
}
async function guardarReporte() {
  const t = totales();
  const r = { id: F.id, fecha: F.fecha, llave: user.llave, usuario: user.nombre, maquina: String(F.maquina).trim(), turno: F.turno, albaran: F.albaran.toUpperCase().replace(/\s+/g, ''), h_ini: num(F.h_ini), h_fin: num(F.h_fin), h_hor: t.hh, h_trab: t.trab, h_parada: t.par, modo: F.modo,
    det: F.det.map(x => { const o = { k: x.k, cc: x.cc, a: x.a, g: x.g, h: horaFila(x), n: x.n }; if (F.modo === 'HORARIO') { o.d = x.d; o.t = x.t; } o.parada = x.k === 'X'; o.fuera = x.k === 'F'; return o; }),
    obs: F.obs.trim(), n_ini: Math.max(F.fotos.ini.length, F.tiene.ini), n_fin: Math.max(F.fotos.fin.length, F.tiene.fin), n_parte: Math.max(F.fotos.parte.length, F.tiene.parte), registrado: F.editar ? (REPS.find(x => x.id === F.id) || {}).registrado || hoy() : hoy(), creado_ms: F.creado || 0, alertas: '', nuevo: F.nuevo };
  envio('💾', 'Guardando…', 'No cierres la aplicación hasta que termine.', true);
  try {
    for (const c of ['ini', 'fin', 'parte']) { if (F.fotos[c].length) await kv.set('f_' + r.id + '_' + c, F.fotos[c]); }
    const i = REPS.findIndex(x => x.id === r.id); if (i >= 0) REPS[i] = r; else REPS.push(r);
    COLA = COLA.filter(o => !(o.t === 'g' && o.rid === r.id));
    COLA.push({ id: Date.now() + Math.random(), t: 'g', llave: user.llave, rid: r.id, creado: F.editar ? 0 : (F.creado || Date.now()) });
    await guardarReps(); await guardarCola(); await kv.del('borrador_' + user.llave);
  } catch (e) { envio('⚠️', 'No se pudo guardar en el teléfono', 'Revisa que el teléfono tenga espacio y vuelve a intentar.', false, [['Cerrar', () => { $('envio').hidden = true; }, 'sec']]); return; }
  F = null; $('barra').hidden = true;

async function enviarYMostrar(r) {
  if (!navigator.onLine) return finEnvio(r, 'red');
  envio('📤', 'Enviando el reporte…', 'Guardado en el teléfono ✔  ·  Enviando a la oficina… No cierres la aplicación.', true);
  const res = await sincronizar(true, true);
  finEnvio(r, res);
}
function finEnvio(r, res) {
  const volver = ['🏠 Ir al inicio', () => { $('envio').hidden = true; abrirInicio(); }, 'verde'];
  if (res === 'ok' || (res && res.ok)) envio('✅', '¡Reporte enviado!', 'Ya llegó a la oficina. Guarda el papel junto con el reporte.', false, [volver, ['➕ Otro reporte', () => { $('envio').hidden = true; abrirForm(null); }, 'sec']]);
  else if (res && res.error) envio('⚠️', 'La oficina no aceptó el reporte', res.error, false, [['✏️ Corregir el reporte', () => { $('envio').hidden = true; const x = REPS.find(y => y.id === r.id); if (x) abrirForm(x); else abrirInicio(); }, 'verde'], ['Ir al inicio', () => { $('envio').hidden = true; abrirInicio(); }, 'sec']]);
  else envio('💾', 'Guardado en el teléfono', 'NO ha llegado a la oficina todavía. Se enviará solo cuando haya señal. No borres la aplicación.', false, [volver, ['🔄 Intentar enviar otra vez', () => enviarYMostrar(r), 'sec']]);
}
async function sincronizar(manual, ui) {
  if (sincronizando) return 'ocupado';

    for (const op of COLA.slice()) {
      if (op.error || !COLA.includes(op)) continue;
      let r;
      if (op.t === 'g') {
        const rep = REPS.find(x => x.id === op.rid); if (!rep) { COLA = COLA.filter(o => o !== op); await guardarCola(); continue; }
        const p = { id: rep.id, fecha: rep.fecha, maquina: rep.maquina, turno: rep.turno, albaran: rep.albaran, h_ini: rep.h_ini, h_fin: rep.h_fin, modo: rep.modo, det: rep.det.map(x => ({ k: x.k, cc: x.cc, a: x.a, h: x.h, d: x.d, t: x.t, n: x.n })), obs: rep.obs };
        for (const c of ['ini', 'fin', 'parte']) { const f = asArr(await kv.get('f_' + rep.id + '_' + c)); if (f.length) p['foto_' + c] = f; }
        try { r = await api({ accion: 'mq_guardar', llave: op.llave, rep: p, creado: op.creado || 0 }, 240000); } catch (e) { resultado = 'red'; break; }
      } else { try { r = await api({ accion: 'mq_eliminar', llave: op.llave, id: op.rid }, 60000); } catch (e) { resultado = 'red'; break; } }
      if (!r || !r.ok) { op.error = (r && r.mensaje) || 'La oficina no aceptó el cambio'; await guardarCola(); resultado = { error: op.error }; continue; }
      const vigente = COLA.find(o => o.t === op.t && o.rid === op.rid);
      if (vigente && vigente.id === op.id) COLA = COLA.filter(o => o !== op);
      if (op.t === 'g') { const rep = REPS.find(x => x.id === op.rid); if (rep && vigente && vigente.id === op.id) { rep.nuevo = false; rep.alertas = (r.alertas || []).join('; '); rep.n_ini = r.n_ini || rep.n_ini; rep.n_fin = r.n_fin || rep.n_fin; rep.n_parte = r.n_parte || rep.n_parte; } for (const c of ['ini', 'fin', 'parte']) await kv.del('f_' + op.rid + '_' + c); }
      await guardarReps(); await guardarCola();
    }
  } catch (e) { resultado = 'red'; }
  finally { sincronizando = false; if (user && !$('inicio').hidden) pintarInicio(); if (!ui) refrescar(true); }
  if (resultado === 'ok' && COLA.some(o => o.error)) resultado = { error: (COLA.find(o => o.error) || {}).error };
  return resultado;
}

  let n = 0; try { const c = (await kv.get('cola')) || []; n = c.filter(o => !user || o.llave === user.llave).length; } catch (x) {}
  const r = $('red'); r.textContent = navigator.onLine ? 'Con señal' : 'Sin señal';
  if (n) { const b = document.createElement('div'); b.className = 'pen'; b.textContent = '⏳ ' + n + (n === 1 ? ' sin enviar' : ' sin enviar'); r.appendChild(b); }

setInterval(estadoRed, 3000);
setInterval(() => { if (user && navigator.onLine && !sincronizando && COLA.some(o => !o.error) && $('envio').hidden) sincronizar(); }, 25000);

window.addEventListener('online', () => { estadoRed(); sincronizar(); refrescar(true); });

(async () => {
