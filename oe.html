<script>
function jpg1MB(cv, q) { var d = cv.toDataURL('image/jpeg', q); while (d.length > 1250000 && q > 0.35) { q -= 0.1; d = cv.toDataURL('image/jpeg', q); } if (d.length > 1250000) { var c2 = document.createElement('canvas'); c2.width = Math.round(cv.width * 0.7); c2.height = Math.round(cv.height * 0.7); c2.getContext('2d').drawImage(cv, 0, 0, c2.width, c2.height); return jpg1MB(c2, 0.6); } return d; } // toda foto queda < 1 MB

'use strict';
const API = 'https://script.google.com/macros/s/AKfycbz6LjPHWbh_vLcYhwSvYFp8tMN737nX-hJUPiX6vOvLb_3tEAyH9zeCC_4pqNSPRz9O1w/exec';
const LS = 'oe_ses_v1', LSC = 'oe_cache_v1', TITULO = 'OE · Topografía';
const COSTADOS = ['ORIENTAL', 'OCCIDENTAL', 'NO APLICA'];
const ICO = { '2.01': '🛣️', '2.02': '🚌', '2.03': '🛤️', '2.04': '🌳', '2.05': '🚲', '2.06': '🌉', '2.07': '🔄', '2.08': '🚧', '2.09': '🏢', '2.10': '🏗️', '2.11': '💧', '2.12': '⚡', 'MANT': '🛠️' };
const $ = s => document.querySelector(s);
const esc = t => String(t == null ? '' : t).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const lsGet = k => { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } };
const lsSet = (k, v) => { try { if (v == null) localStorage.removeItem(k); else localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
const z2 = n => String(n).padStart(2, '0');
const hoyISO = () => { const d = new Date(); return d.getFullYear() + '-' + z2(d.getMonth() + 1) + '-' + z2(d.getDate()); };
const sumDias = (f, n) => { const d = new Date(f + 'T12:00:00'); d.setDate(d.getDate() + n); return d.getFullYear() + '-' + z2(d.getMonth() + 1) + '-' + z2(d.getDate()); };
const num = v => { const t = String(v == null ? '' : v).trim(); const n = Number(t.replace(',', '.')); return t !== '' && isFinite(n) ? n : NaN; };
const r3 = x => Math.round(x * 1000) / 1000;
const fmt = x => isNaN(x) ? '—' : r3(x).toLocaleString('es-CO', { maximumFractionDigits: 3 });
const fechaTxt = f => f.split('-').reverse().join('/');

/* Unidad → cuántas medidas se piden (largo, ancho, alto). Las demás piden una sola cantidad. */
const UND = { 'M3': 3, 'M2': 2, 'ML': 1, 'M': 1 };
const NDIM = ['Largo (m)', 'Ancho (m)', 'Alto / espesor (m)'];
const undTxt = u => ({ 'M3': 'm³', 'M2': 'm²', 'ML': 'm', 'UN': 'und', 'KG': 'kg', 'M3-KM': 'm³·km', 'TON-M': 'ton·m' }[u] || u);

const LSM = 'oe_mis_v1';
let S = { ses: lsGet(LS), cat: null, tab: 'rep', sub: 'hoy', abierto: {}, mis: {}, cargMis: false, fecha: hoyISO(), hito: '', srv: [], pend: [], f: null, busy: false, cargando: false, offline: false, loginErr: '', q: '', lev: null, levLista: [], cargLev: false };

/* ---------- Cola local (IndexedDB): los registros con foto esperan aquí hasta que haya señal ---------- */
const DB = (() => {
  let db = null;
  const abrir = () => db ? Promise.resolve(db) : new Promise((ok, no) => { const r = indexedDB.open('oe_db', 1); r.onupgradeneeded = () => r.result.createObjectStore('cola', { keyPath: 'id' }); r.onsuccess = () => { db = r.result; ok(db); }; r.onerror = () => no(r.error); });
  const tx = (m, f) => abrir().then(d => new Promise((ok, no) => { const t = d.transaction('cola', m), s = t.objectStore('cola'), q = f(s); t.oncomplete = () => ok(q && q.result); t.onerror = () => no(t.error); }));
  return { todos: () => tx('readonly', s => s.getAll()), poner: v => tx('readwrite', s => s.put(v)), quitar: id => tx('readwrite', s => s.delete(id)) };
})();

async function llamar(d, ms) {
  const c = new AbortController(), t = setTimeout(() => c.abort(), ms || 45000);
  try { const r = await fetch(API, { method: 'POST', body: JSON.stringify(d), signal: c.signal }); return await r.json(); } finally { clearTimeout(t); }
}
function toast(m) { const t = $('#toast'); t.textContent = m; t.className = 'v'; clearTimeout(toast._t); toast._t = setTimeout(() => { t.className = ''; }, 3200); }

/* ---------- Catálogo (hitos → paquetes → actividades) ---------- */
async function cargarCat() {
  if (S.cat) return;
  try { const r = await fetch('oe/catalogo.json'); S.cat = await r.json(); } catch (e) { S.cat = null; }
}
// UF6 y UF7 aún no tienen catálogo propio: usan temporalmente la lista de la UF1 (o de la primera UF que tenga el hito) con su propio código
// (el primer dígito del centro de costo es la UF: 1M06.1 → 6M06.1 en la UF6)
const CAT_UF = {};
const paquetesDe = (h, uf) => {
  if (!S.cat) return [];
  if (S.cat.cat[h + '|' + uf]) return S.cat.cat[h + '|' + uf];
  // si el hito no está en esta UF (ej. Puente peatonal en UF1), se usa la lista de la primera UF que lo tenga, con el código de esta UF
  const k = h + '|' + uf, d = uf.slice(2);
  // base: la UF1; si el hito no existe en la UF1 (ej. Puente peatonal), la primera UF que lo tenga
  const base = ['UF1', 'UF2', 'UF3', 'UF4', 'UF5'].find(u => S.cat.cat[h + '|' + u]);
  if (!CAT_UF[k]) CAT_UF[k] = base ? S.cat.cat[h + '|' + base].map(p => [p[0], p[1].map(a => [String(a[0]).replace(/^\d/, d), a[1], a[2]])]) : [];
  return CAT_UF[k];
};
// Redes (2.11 húmedas, 2.12 secas): primero se elige el tipo de red. CAPEX usa la estructura del proyecto; una subcuenta o ENEL usa su propio catálogo.
// Revisión de la oficina: el topógrafo ve el color y el motivo; lo revisado ya no se edita
const REVT = { APROBADO: ['🟢 Aprobado', '#e6f6ee', '#14532d'], CORREGIDO: ['🔵 Corregido por oficina', '#e3eefc', '#0d3c7a'], RECHAZADO: ['🔴 Rechazado', '#fde8e8', '#8a1c1c'] };
const revTag = x => x.rev && REVT[x.rev] ? '<span class="tag" style="background:' + REVT[x.rev][1] + ';color:' + REVT[x.rev][2] + '">' + REVT[x.rev][0] + '</span>' + (x.rev_motivo ? '<div class="peq" style="color:' + REVT[x.rev][2] + ';margin-top:2px">Oficina: ' + esc(x.rev_motivo) + '</div>' : '') : '';
const esRed = h => h === '2.11' || h === '2.12';
const esMant = h => h === 'MANT';
const redLista0 = r => !!(S.cat && S.cat.redes && S.cat.redes.some(x => x[0] === r));
// Centros de costo creados por la oficina en el Dashboard: se suman a la lista de su hito y UF (en su paquete o en «Nuevos centros de costo»)
S.ccx = lsGet('oe_ccx') || [];
function conNuevos(L, h, uf) {
  const X = (S.ccx || []).filter(x => x[4] === h && (!x[3] || x[3] === uf)); if (!X.length) return L;
  const usados = new Set([].concat(...L.map(p => p[1].map(a => String(a[0]).toUpperCase()))));
  const R = L.map(p => [p[0], p[1].concat(X.filter(x => !usados.has(x[0]) && String(x[5]).toUpperCase() === String(p[0]).toUpperCase()).map(x => [x[0], x[1], x[2]]))]);
  const resto = X.filter(x => !usados.has(x[0]) && !L.some(p => String(p[0]).toUpperCase() === String(x[5]).toUpperCase())).map(x => [x[0], x[1], x[2]]);
  return resto.length ? R.concat([['Nuevos centros de costo', resto]]) : R;
}
function pqs(f, h) {
  f = f || S.f; h = h || S.hito; if (!S.cat) return [];
  if (esMant(h)) return conNuevos((S.cat.sub && S.cat.sub.UF0) || [], h, 'UF0');
  if (esRed(h) && f.red && f.red !== 'CAPEX') return (S.cat.sub && S.cat.sub[f.red]) || [];
  return conNuevos(paquetesDe(h, f.uf), h, f.uf);
}
// Actividades del paquete elegido; con «Otro paquete» (pq = 'O') se muestran todas las del hito/red
function actsPq(f) { f = f || S.f; const L = pqs(f); return f.pq === 'O' ? [].concat(...L.map(p => p[1])) : ((L[f.pq] || ['', []])[1]); }
const P = () => { let L = PASOS.slice(); if (esMant(S.hito)) L = L.filter(x => x[0] !== 'uf'); if (esRed(S.hito)) L = [['red', '¿Qué tipo de red?']].concat(L); return L; };
const ix = k => P().findIndex(x => x[0] === k);
// Estructura a la que pertenece una actividad (por el prefijo del código: 1M06.1 → Muro 6, 1S05.17 → Sifón 5, 1MC7 → muros en concreto)
const estDe = c => { c = String(c || ''); const p = c.includes('.') ? c.split('.')[0] : ((c.match(/^\d*[A-Z]+/) || [''])[0]); return (S.cat && S.cat.est && S.cat.est[p]) || ''; };
const nomHito = c => { const x = S.cat && S.cat.hitos.find(y => y[0] === c); return x ? x[1] : ''; };

/* ---------- Datos del día: se abre al instante con lo guardado y se actualiza por detrás ---------- */
async function pedirDia() {
  if (!S.ses) return;
  const c = lsGet(LSC);
  if (c && c.llave === S.ses.llave && c.f === S.fecha) S.srv = c.r;
  S.pend = (await DB.todos().catch(() => [])).filter(x => x.llave === S.ses.llave);
  S.cargando = true; render();
  try {
    const r = await llamar({ accion: 'oe_lista', llave: S.ses.llave, fecha: S.fecha });
    S.offline = false;
    if (r && r.ok) { S.srv = r.registros; S.mis[S.fecha] = r.registros; lsSet(LSC, { llave: S.ses.llave, f: S.fecha, r: r.registros }); if (Array.isArray(r.ccs)) { S.ccx = r.ccs; lsSet('oe_ccx', r.ccs); } }
    else if (r && /Llave/.test(r.mensaje || '')) { salir(); S.loginErr = 'Tu llave ya no es válida.'; render(); return; }
  } catch (e) { S.offline = true; }
  S.cargando = false; render();
}
async function sincronizar() {
  if (!S.ses || S.busy || !navigator.onLine) return;
  S.busy = true; render();
  try {
    const cola = (await DB.todos()).filter(x => x.llave === S.ses.llave);
    for (const x of cola) {
      const { llave, error, ...reg } = x;
      let r; try { r = await llamar({ accion: 'oe_guardar', llave: S.ses.llave, reg }, 60000); } catch (e) { S.offline = true; break; }
      if (r && (r.ok || r.codigo === 'PASADO' || r.codigo === 'REVISADO')) { await DB.quitar(x.id); if (r.codigo === 'REVISADO') toast(r.mensaje); }
      else if (r && !r.ok) { x.error = r.mensaje || 'Error'; await DB.poner(x); }
    }
  } finally { S.busy = false; }
  await pedirDia(); if (S.tab === 'res') pedirMis();
}
/* Hojas de cálculo guardan "2.10" como número 2.1: se vuelve a su código de dos decimales */
const normH = h => { const t = String(h == null ? '' : h).trim(); return /^\d\.\d$/.test(t) ? t + '0' : t; };
const regDe = f => {
  const base = f === S.fecha ? S.srv : (S.mis[f] || []), pf = S.pend.filter(x => x.fecha === f), pid = new Set(pf.map(x => x.id));

function sig() { if (P()[S.f.p][0] === 'act' && S.f.otra) { usarOtra(); return; } const m = validarPaso(); if (m) { S.f.msg = m; render(); window.scrollTo(0, 0); return; } ir(S.f.p + 1); }
async function guardar() {

function cambioDia(n) { const hoy = hoyISO(); if (n && n <= hoy && n >= sumDias(hoy, -7)) { S.fecha = n; S.srv = []; render(); pedirDia(); } }

  if (a === 'red' || a === 'redOtra') { const r = a === 'red' ? v : (String(S.f.redOtra || '').trim() ? (S.f.redTipo || 'SUBCUENTA') + ': ' + String(S.f.redOtra).trim().toUpperCase() : ''); if (!r) { S.f.msg = 'Escribe el nombre de la red.'; render(); return; } if (S.f.red !== r) { S.f.pq = ''; S.f.act = null; S.f.otra = false; } S.f.red = r; ir(ix('red') + 1); return; }

  if (a === 'pq') { if (String(S.f.pq) !== String(v)) { S.f.act = null; S.f.otra = false; } S.f.pqEsc = false; S.f.pq = v; ir(ix('act')); return; }
  if (a === 'act') { S.f.otra = false; const x = actsPq().find(y => y[0] === v); if (!S.f.act || S.f.act.c !== x[0]) { S.f.largo = S.f.ancho = S.f.alto = S.f.cant = S.f.desc = ''; S.f.fac = '1'; } S.f.act = { c: x[0], d: x[1], u: x[2] }; ir(ix('med')); return; }
