<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' https://script.google.com https://script.googleusercontent.com; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#0a7f2e">
<meta name="author" content="Carlos Eduardo Bermúdez Castro">
<link rel="manifest" href="manifest-oe.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="OE Topografía">
<link rel="icon" href="icon-192.png">
<title>OE Topografía</title>
<style>
:root{--ink:#14202b;--hv:#0a7f2e;--navy:#1f2d3d;--paper:#eef0f2;--line:#c9d0d6;--ok:#1f7a3d;--err:#b3261e;--mut:#51606d;--warn:#b36b00}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--paper);color:var(--ink);font-size:18px;padding-bottom:90px}
header{position:sticky;top:0;z-index:5;background:var(--hv);color:#fff;padding:8px 14px;display:flex;align-items:center;gap:10px;border-bottom:4px solid var(--navy)}
header .logo{height:38px;width:auto;background:#fff;border-radius:6px;padding:2px 4px}
header h1{font-size:17px;margin:0;flex:1;line-height:1.15}header h1 small{display:block;font-weight:400;font-size:12px;color:#d7f0de}
.ib{width:40px;height:40px;min-height:0;padding:0;margin:0;border-radius:10px;border:0;background:rgba(0,0,0,.28);color:#fff;font-size:18px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;flex:none;width:40px}
main{max-width:680px;margin:auto;padding:12px 14px}
h2{font-size:20px;margin:4px 0 8px}
.card{background:#fff;border:1px solid var(--line);border-radius:8px;padding:12px;margin-bottom:12px}
label{font-size:15px;color:var(--mut);display:block;margin-bottom:3px;font-weight:600}
input,select{width:100%;padding:13px;font-size:19px;border:1px solid #8794a0;border-radius:6px;background:#fff;color:var(--ink)}
input:focus,select:focus,button:focus-visible{outline:3px solid var(--hv);outline-offset:1px}
button{padding:14px;min-height:52px;font-size:18px;font-weight:700;border:0;border-radius:8px;background:var(--ink);color:#fff;width:100%;cursor:pointer}
button.sec{background:#fff;color:var(--ink);border:2px solid var(--ink)}
button.verde{background:var(--hv)}
button.rojo{background:#fff;color:var(--err);border:2px solid var(--err)}
button:disabled{opacity:.5}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hito{position:relative;text-align:left;background:#fff;color:var(--ink);border:2px solid var(--line);border-left:8px solid var(--hv);padding:10px 12px;min-height:76px;line-height:1.2}
.hito b{font-size:22px;display:block;color:var(--hv)}.hito span{font-size:15px;font-weight:600}
.hito .n{position:absolute;right:8px;top:8px;background:var(--hv);color:#fff;border-radius:12px;min-width:26px;height:26px;line-height:26px;text-align:center;font-size:14px;padding:0 6px}
.hito.vacio{border-left-color:var(--line)}.hito.vacio b{color:var(--mut)}.hito.vacio .n{display:none}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{width:auto;min-width:64px;padding:10px 14px;min-height:46px;background:#fff;color:var(--ink);border:2px solid var(--ink);font-weight:600}
.chip.on{background:var(--ink);color:#fff}
.paso{border-left:6px solid var(--hv)}
.paso h3{font-size:19px;margin:0 0 8px}.paso h3 i{display:inline-block;background:var(--hv);color:#fff;border-radius:50%;width:28px;height:28px;line-height:28px;text-align:center;font-style:normal;font-size:15px;margin-right:6px}
.row{display:flex;gap:8px}.row>*{flex:1;min-width:0}
.ab{display:flex;align-items:center;gap:6px}.ab b{font-size:22px}
.act{display:block;text-align:left;background:#fff;color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:9px 10px;min-height:0;font-size:16px;font-weight:600;margin-top:6px}
.act small{display:block;color:var(--mut);font-weight:400}
.sel{background:#e8f5ec;border:2px solid var(--ok);border-radius:8px;padding:9px 11px;font-size:16px;font-weight:700;margin-top:8px}
.tot{background:#e8f5ec;border:2px solid var(--ok);border-radius:8px;padding:10px 12px;font-size:20px;font-weight:800;margin-top:10px}
.tot small{display:block;font-weight:400;color:var(--mut);font-size:14px}
.reg{border-top:1px solid var(--line);padding:9px 0;font-size:16px}.reg:first-child{border-top:0}
.reg b{display:block}.reg small{color:var(--mut)}
.tag{font-size:12px;color:#fff;background:var(--mut);border-radius:4px;padding:2px 6px;margin-left:4px;font-weight:600}.tag.pend{background:var(--warn)}.tag.ok{background:var(--ok)}
.aviso{padding:10px 12px;border-radius:6px;margin-bottom:10px;font-size:16px;border:1px solid var(--line);background:#fff}
.aviso.err{border-color:var(--err);color:var(--err);font-weight:700;background:#fdecea}.aviso.ok{border-color:var(--ok);color:var(--ok)}
.mal{border:3px solid var(--err)!important}
#carga{position:fixed;left:50%;transform:translateX(-50%);top:62px;background:#1f2d3d;color:#fff;padding:8px 16px;border-radius:20px;font-size:15px;z-index:9;display:none}
#barra{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:10px 14px;display:flex;gap:10px;z-index:4}
#barra button{flex:1;max-width:340px;margin:auto}
img.prev{width:100%;max-height:260px;object-fit:contain;border-radius:6px;background:#000;margin-top:8px}
.gps{font-size:16px}.gps a{color:var(--hv);font-weight:700}
small.m{color:var(--mut)}
@media(min-width:620px){.grid{grid-template-columns:1fr 1fr 1fr}}
</style>
</head>
<body>
<header>
  <img class="logo" src="logo_ccsn.png" alt="CCSN">
  <h1>OE · Topografía<small id="quien"></small></h1>
  <button class="ib" id="bAct" title="Actualizar" style="display:none">⟳</button>
  <button class="ib" id="bSal" title="Salir" style="display:none">⏻</button>
</header>
<div id="carga">Actualizando datos…</div>
<main id="app"></main>
<div id="barra" style="display:none"></div>
<script>
'use strict';
const API = 'https://script.google.com/macros/s/AKfycbz6LjPHWbh_vLcYhwSvYFp8tMN737nX-hJUPiX6vOvLb_3tEAyH9zeCC_4pqNSPRz9O1w/exec';
const LS = 'oe_ses_v1', LSC = 'oe_cache_v1';
const COSTADOS = ['ORIENTAL', 'OCCIDENTAL', 'NO APLICA'];
const $ = s => document.querySelector(s);
const esc = t => String(t == null ? '' : t).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const lsGet = k => { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } };
const lsSet = (k, v) => { try { if (v == null) localStorage.removeItem(k); else localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
const hoyISO = () => { const d = new Date(), z = n => String(n).padStart(2, '0'); return d.getFullYear() + '-' + z(d.getMonth() + 1) + '-' + z(d.getDate()); };
const sumDias = (f, n) => { const d = new Date(f + 'T12:00:00'); d.setDate(d.getDate() + n); const z = x => String(x).padStart(2, '0'); return d.getFullYear() + '-' + z(d.getMonth() + 1) + '-' + z(d.getDate()); };
const num = v => { const n = Number(String(v == null ? '' : v).trim().replace(',', '.')); return isFinite(n) && String(v).trim() !== '' ? n : NaN; };
const r3 = x => Math.round(x * 1000) / 1000;
const fmt = x => isNaN(x) ? '—' : r3(x).toLocaleString('es-CO', { maximumFractionDigits: 3 });

/* Unidad → cuántas medidas se piden (largo, ancho, alto). Las demás piden una sola cantidad. */
const UND = { 'M3': 3, 'M2': 2, 'ML': 1 };
const NDIM = ['Largo (m)', 'Ancho (m)', 'Alto / espesor (m)'];
const undTxt = u => ({ 'M3': 'm³', 'M2': 'm²', 'ML': 'm', 'UN': 'und', 'KG': 'kg', 'M3-KM': 'm³·km', 'TON-M': 'ton·m' }[u] || u);

let S = { ses: lsGet(LS), cat: null, fecha: hoyISO(), vista: 'hitos', hito: '', srv: [], pend: [], f: null, busy: false, msg: '', msgT: 'ok', q: '' };

/* ---------- Cola local (IndexedDB): los registros con foto esperan aquí hasta que haya señal ---------- */
const DB = (() => {
  let db = null;
  const abrir = () => db ? Promise.resolve(db) : new Promise((ok, no) => { const r = indexedDB.open('oe_db', 1); r.onupgradeneeded = () => r.result.createObjectStore('cola', { keyPath: 'id' }); r.onsuccess = () => { db = r.result; ok(db); }; r.onerror = () => no(r.error); });
  const tx = (m, f) => abrir().then(d => new Promise((ok, no) => { const t = d.transaction('cola', m), s = t.objectStore('cola'), q = f(s); t.oncomplete = () => ok(q && q.result); t.onerror = () => no(t.error); }));
  return { todos: () => tx('readonly', s => s.getAll()), poner: v => tx('readwrite', s => s.put(v)), quitar: id => tx('readwrite', s => s.delete(id)) };
})();

async function llamar(d, ms) {
  const c = new AbortController(), t = setTimeout(() => c.abort(), ms || 45000);
  try { const r = await fetch(API, { method: 'POST', body: JSON.stringify(d), signal: c.signal }); return await r.json(); } finally { clearTimeout(t); }
}
function aviso(t, tipo) { S.msg = t; S.msgT = tipo || 'ok'; }
function cargando(on, txt) { const e = $('#carga'); e.style.display = on ? 'block' : 'none'; if (txt) e.textContent = txt; }

/* ---------- Catálogo (hitos → paquetes → actividades) ---------- */
async function cargarCat() {
  if (S.cat) return;
  try { const r = await fetch('oe/catalogo.json'); S.cat = await r.json(); } catch (e) { S.cat = null; }
}
const paquetesDe = (h, uf) => (S.cat && S.cat.cat[h + '|' + uf]) || [];

/* ---------- Registros del día ---------- */
async function pedirDia() {
  if (!S.ses) return;
  const c = lsGet(LSC);
  if (c && c.llave === S.ses.llave && c.f === S.fecha) S.srv = c.r;
  cargando(true, 'Actualizando datos…');
  try {
    const r = await llamar({ accion: 'oe_lista', llave: S.ses.llave, fecha: S.fecha });
    if (r && r.ok) { S.srv = r.registros; lsSet(LSC, { llave: S.ses.llave, f: S.fecha, r: r.registros }); }
    else if (r && /Llave/.test(r.mensaje || '')) { salir(); aviso('Tu llave ya no es válida.', 'err'); }
  } catch (e) { /* sin señal: se muestran los datos guardados */ }
  cargando(false);
  S.pend = (await DB.todos().catch(() => [])).filter(x => x.llave === S.ses.llave);
  pintar();
}
async function sincronizar() {
  if (!S.ses || S.busy || !navigator.onLine) return;
  S.busy = true;
  try {
    const cola = (await DB.todos()).filter(x => x.llave === S.ses.llave);
    for (const x of cola) {
      const { llave, ...reg } = x;
      let r; try { r = await llamar({ accion: 'oe_guardar', llave: S.ses.llave, reg }, 60000); } catch (e) { break; }
      if (r && (r.ok || r.codigo === 'PASADO' || /no válid/i.test(r.mensaje || ''))) await DB.quitar(x.id);
      else if (r && !r.ok) { x.error = r.mensaje || 'Error'; await DB.poner(x); }
    }
  } finally { S.busy = false; }
  await pedirDia();
}
const todosDia = () => {
  const ids = new Set(S.srv.map(x => x.id));
  return S.srv.map(x => ({ ...x, _ok: true })).concat(S.pend.filter(x => x.fecha === S.fecha && !ids.has(x.id)).map(x => ({ ...x, foto: !!x.foto, _ok: false })));
};

/* ---------- Pantallas ---------- */
function pintar() {
  const y = window.scrollY, A = $('#app'), B = $('#barra');
  $('#quien').textContent = S.ses ? S.ses.nombre : '';
  $('#bAct').style.display = $('#bSal').style.display = S.ses ? '' : 'none';
  B.style.display = 'none';
  if (!S.ses) A.innerHTML = vLogin();
  else if (S.vista === 'form') { A.innerHTML = vForm(); B.style.display = 'flex'; B.innerHTML = '<button class="sec" data-a="cancelar">Cancelar</button><button class="verde" data-a="guardar"' + (S.f.guardando ? ' disabled' : '') + '>' + (S.f.guardando ? 'Guardando…' : '💾 Guardar registro') + '</button>'; }
  else if (S.vista === 'hito') A.innerHTML = vHito();
  else A.innerHTML = vHitos();
  window.scrollTo(0, y);
}
function msg() { return S.msg ? '<div class="aviso ' + (S.msgT === 'err' ? 'err' : 'ok') + '">' + esc(S.msg) + '</div>' : ''; }
function vLogin() {
  return '<div class="card"><h2>Entrar</h2><p style="margin:0 0 10px;color:var(--mut)">Escribe tu llave de topógrafo.</p>' + msg() + '<input id="llave" type="password" autocomplete="off" placeholder="Llave" style="margin-bottom:10px"><button class="verde" data-a="entrar">Entrar</button></div>';
}
function vHitos() {
  const reg = todosDia(), por = {}; reg.forEach(x => por[x.hito] = (por[x.hito] || 0) + 1);
  const hoy = hoyISO(), pen = S.pend.length;
  let h = msg() + '<div class="card"><label>Día del parte</label><div class="row"><button class="sec" data-a="dia" data-v="-1" ' + (S.fecha <= sumDias(hoy, -3) ? 'disabled' : '') + '>◀</button><input type="date" id="fecha" value="' + S.fecha + '" min="' + sumDias(hoy, -3) + '" max="' + hoy + '" style="flex:3;text-align:center"><button class="sec" data-a="dia" data-v="1" ' + (S.fecha >= hoy ? 'disabled' : '') + '>▶</button></div></div>';
  if (pen) h += '<div class="aviso" style="border-color:var(--warn);color:var(--warn)">⏳ ' + pen + ' registro(s) esperando señal para subirse. <button class="sec" style="margin-top:8px" data-a="sync">Subir ahora</button></div>';
  h += '<h2>¿En qué hito trabajaste?</h2><div class="grid">';
  (S.cat ? S.cat.hitos : []).forEach(x => { const n = por[x[0]] || 0; h += '<button class="hito' + (n ? '' : ' vacio') + '" data-a="hito" data-v="' + x[0] + '"><b>' + x[0] + '</b><span>' + esc(x[1]) + '</span><i class="n">' + n + '</i></button>'; });
  h += '</div>';
  if (!S.cat) h += '<div class="aviso err">No se pudo cargar el catálogo de actividades. Conéctate una vez para guardarlo.</div>';
  return h + '<p style="text-align:center;color:var(--mut);font-size:14px;margin-top:16px">Hasta 12 reportes por día: uno por hito, con las actividades que ejecutaste en cada uno.</p>';
}
function nomHito(c) { const x = S.cat && S.cat.hitos.find(y => y[0] === c); return x ? x[1] : ''; }
function vHito() {
  const reg = todosDia().filter(x => x.hito === S.hito).sort((a, b) => String(a.creado || '~').localeCompare(String(b.creado || '~')));
  let h = msg() + '<div class="row" style="margin-bottom:10px"><button class="sec" data-a="volver" style="flex:1">◀ Hitos</button></div><h2>' + esc(S.hito) + ' · ' + esc(nomHito(S.hito)) + ' <small class="m">' + S.fecha.split('-').reverse().join('/') + '</small></h2>';
  h += '<div class="card">' + (reg.length ? reg.map(x => '<div class="reg"><b>' + esc(x.actividad) + '</b><small>' + esc(x.uf) + ' · ' + esc(x.costado) + ' · ' + esc(x.abIni) + ' → ' + esc(x.abFin) + '</small><br><b style="color:var(--hv)">' + fmt(Number(x.total)) + ' ' + undTxt(x.und) + '</b> <small>' + (x.foto ? '📷 ' : '') + (x.lat !== '' && x.lat != null ? '📍 ' : '') + '</small>' + (x._ok ? '<span class="tag ok">subido</span>' : '<span class="tag pend">por subir' + (x.error ? ' · ' + esc(x.error) : '') + '</span>') + (x._ok ? ' <button class="rojo" style="width:auto;min-height:36px;padding:4px 10px;font-size:14px;float:right" data-a="anular" data-v="' + esc(x.id) + '">Anular</button>' : '') + '</div>').join('') : '<small class="m">Aún no hay registros en este hito.</small>') + '</div>';
  return h + '<button class="verde" data-a="nuevo">➕ Nuevo registro en ' + esc(S.hito) + '</button>';
}
function idNuevo() { const a = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789', d = new Date(), z = n => String(n).padStart(2, '0'); let s = ''; for (let i = 0; i < 5; i++) s += a[Math.floor(Math.random() * a.length)]; return 'OE-' + String(d.getFullYear()).slice(2) + z(d.getMonth() + 1) + z(d.getDate()) + '-' + s; }
function nuevoForm() {
  return { id: idNuevo(), uf: '', costado: '', kI: '', mI: '', kF: '', mF: '', pq: '', act: null, largo: '', ancho: '', alto: '', cant: '', desc: '', fac: '1', foto: '', gps: null, gpsMsg: 'Buscando ubicación…', obs: '', err: {}, guardando: false };
}
const abTxt = (k, m) => (String(k).trim() === '' && String(m).trim() === '') ? '' : 'K' + String(k).trim().padStart(2, '0') + '+' + String(m).trim().padStart(3, '0');
function nd() { return S.f.act ? (UND[S.f.act.u] || 0) : 0; }
function calc() {
  const f = S.f, n = nd(); let c;
  if (n === 0) c = num(f.cant); else { c = 1; [f.largo, f.ancho, f.alto].slice(0, n).forEach(v => { c *= num(v); }); }
  const d = isNaN(num(f.desc)) ? 0 : num(f.desc), fa = isNaN(num(f.fac)) ? 1 : num(f.fac);
  return { c: c, d: d, fa: fa, t: (c - d) * fa };
}
function chips(arr, sel, acc) { return '<div class="chips">' + arr.map(x => '<button class="chip' + (x === sel ? ' on' : '') + '" data-a="' + acc + '" data-v="' + esc(x) + '">' + esc(x) + '</button>').join('') + '</div>'; }
function vForm() {
  const f = S.f, e = f.err, n = nd(), K = calc(), u = f.act ? f.act.u : '';
  let h = '<h2>' + esc(S.hito) + ' · ' + esc(nomHito(S.hito)) + '</h2>' + msg();
  h += '<div class="card paso' + (e.uf ? ' mal' : '') + '"><h3><i>1</i>UF</h3>' + chips(S.cat.ufs, f.uf, 'uf') + '</div>';
  h += '<div class="card paso' + (e.costado ? ' mal' : '') + '"><h3><i>2</i>Costado</h3>' + chips(COSTADOS, f.costado, 'costado') + '</div>';
  h += '<div class="card paso"><h3><i>3</i>Abscisa de inicio y de fin</h3><label>Inicio</label><div class="ab"><b>K</b><input inputmode="numeric" data-f="kI" value="' + esc(f.kI) + '" placeholder="km" class="' + (e.ab ? 'mal' : '') + '"><b>+</b><input inputmode="numeric" data-f="mI" value="' + esc(f.mI) + '" placeholder="m" class="' + (e.ab ? 'mal' : '') + '"></div><label style="margin-top:8px">Fin</label><div class="ab"><b>K</b><input inputmode="numeric" data-f="kF" value="' + esc(f.kF) + '" placeholder="km" class="' + (e.ab ? 'mal' : '') + '"><b>+</b><input inputmode="numeric" data-f="mF" value="' + esc(f.mF) + '" placeholder="m" class="' + (e.ab ? 'mal' : '') + '"></div></div>';
  // 4. actividad por dependencias: hito → paquete → actividad
  const pqs = f.uf ? paquetesDe(S.hito, f.uf) : [];
  h += '<div class="card paso' + (e.act ? ' mal' : '') + '"><h3><i>4</i>Actividad ejecutada</h3>';
  if (!f.uf) h += '<small class="m">Elige primero la UF.</small>';
  else if (!pqs.length) h += '<div class="aviso">Este hito no tiene actividades en la ' + esc(f.uf) + '.</div>';
  else {
    h += '<label>Paquete de trabajo</label><select data-f="pq"><option value="">Elige el paquete…</option>' + pqs.map((p, i) => '<option value="' + i + '"' + (String(f.pq) === String(i) ? ' selected' : '') + '>' + esc(p[0]) + ' (' + p[1].length + ')</option>').join('') + '</select>';
    if (f.pq !== '' && pqs[f.pq] && !f.act) {
      const q = S.q.toLowerCase(), L = pqs[f.pq][1].filter(a => !q || (a[0] + ' ' + a[1]).toLowerCase().includes(q));
      h += '<label style="margin-top:10px">Actividad</label><input id="buscar" placeholder="Buscar por nombre o código…" value="' + esc(S.q) + '">';
      h += L.slice(0, 40).map(a => '<button class="act" data-a="act" data-v="' + esc(a[0]) + '">' + esc(a[1]) + '<small>' + esc(a[0]) + ' · ' + undTxt(a[2]) + '</small></button>').join('') + (L.length > 40 ? '<small class="m">Hay ' + (L.length - 40) + ' más: escribe para filtrar.</small>' : '') + (L.length ? '' : '<small class="m">Sin resultados.</small>');
    }
    if (f.act) h += '<div class="sel">✔ ' + esc(f.act.d) + '<br><small class="m">' + esc(f.act.c) + ' · unidad ' + undTxt(f.act.u) + '</small></div><button class="sec" style="margin-top:8px;min-height:42px" data-a="cambiarAct">Cambiar actividad</button>';
  }
  h += '</div>';
  // 5. medidas: la unidad de la actividad decide qué campos se ven
  if (f.act) {
    h += '<div class="card paso' + (e.med ? ' mal' : '') + '"><h3><i>5</i>Medidas (' + undTxt(u) + ')</h3>';
    if (n === 0) h += '<label>Cantidad (' + undTxt(u) + ')</label><input inputmode="decimal" data-f="cant" value="' + esc(f.cant) + '">';
    else { h += '<div class="row">'; ['largo', 'ancho', 'alto'].slice(0, n).forEach((k, i) => { h += '<div><label>' + NDIM[i] + '</label><input inputmode="decimal" data-f="' + k + '" value="' + esc(f[k]) + '"></div>'; }); h += '</div>'; h += '<label style="margin-top:8px">Cantidad (' + undTxt(u) + ')</label><input readonly value="' + (isNaN(K.c) ? '' : fmt(K.c)) + '" style="background:#f1f3f5">'; }
    h += '<div class="row" style="margin-top:8px"><div><label>Descuento (' + undTxt(u) + ')</label><input inputmode="decimal" data-f="desc" value="' + esc(f.desc) + '" placeholder="0"></div><div><label>Factor (veces / esponjamiento)</label><input inputmode="decimal" data-f="fac" value="' + esc(f.fac) + '"></div></div>';
    h += '<div class="tot" id="tot">' + totHtml(K, u) + '</div></div>';
  }
  h += '<div class="card paso' + (e.foto ? ' mal' : '') + '"><h3><i>6</i>Foto de la actividad</h3><div class="row"><label class="chip" style="text-align:center;margin:0;color:var(--ink);font-size:17px;cursor:pointer">📷 Cámara<input type="file" accept="image/*" capture="environment" data-foto style="display:none"></label><label class="chip" style="text-align:center;margin:0;color:var(--ink);font-size:17px;cursor:pointer">🖼 Galería<input type="file" accept="image/*" data-foto style="display:none"></label></div>' + (f.foto ? '<img class="prev" src="' + f.foto + '" alt="Foto">' : '<small class="m">Falta la foto.</small>') + '</div>';
  h += '<div class="card paso"><h3><i>7</i>Ubicación GPS</h3><div class="gps" id="gps">' + gpsHtml() + '</div><button class="sec" style="margin-top:8px;min-height:42px" data-a="gps">📍 Actualizar ubicación</button></div>';
  h += '<div class="card"><label>Observación (opcional)</label><input data-f="obs" value="' + esc(f.obs) + '" maxlength="300"></div>';
  return h;
}
const totHtml = (K, u) => (isNaN(K.t) ? '—' : fmt(K.t) + ' ' + undTxt(u)) + '<small>(' + (isNaN(K.c) ? '—' : fmt(K.c)) + ' − ' + fmt(K.d) + ') × ' + fmt(K.fa) + '</small>';
function gpsHtml() {
  const g = S.f.gps;
  return g ? '<b>' + g.lat.toFixed(6) + ', ' + g.lon.toFixed(6) + '</b> <small class="m">± ' + Math.round(g.prec) + ' m</small><br><a href="https://www.google.com/maps?q=' + g.lat + ',' + g.lon + '" target="_blank" rel="noopener">Ver en el mapa</a>' : '<small class="m">' + esc(S.f.gpsMsg) + '</small>';
}
function tomarGps() {
  if (!S.f) return; const f = S.f; f.gps = null; f.gpsMsg = 'Buscando ubicación…'; const el = $('#gps'); if (el) el.innerHTML = gpsHtml();
  if (!navigator.geolocation) { f.gpsMsg = 'Este equipo no tiene GPS.'; return; }
  navigator.geolocation.getCurrentPosition(p => { if (S.f !== f) return; f.gps = { lat: p.coords.latitude, lon: p.coords.longitude, prec: p.coords.accuracy }; const e = $('#gps'); if (e) e.innerHTML = gpsHtml(); },
    err => { if (S.f !== f) return; f.gpsMsg = err.code === 1 ? 'Permiso de ubicación negado: actívalo en el navegador.' : 'No se pudo obtener la ubicación. Intenta de nuevo al aire libre.'; const e = $('#gps'); if (e) e.innerHTML = gpsHtml(); }, { enableHighAccuracy: true, timeout: 25000, maximumAge: 0 });
}
function reducirFoto(file) {
  return new Promise((ok, no) => {
    const url = URL.createObjectURL(file), im = new Image();
    im.onload = () => { const m = 1280, k = Math.min(1, m / Math.max(im.width, im.height)), c = document.createElement('canvas'); c.width = Math.round(im.width * k); c.height = Math.round(im.height * k); c.getContext('2d').drawImage(im, 0, 0, c.width, c.height); URL.revokeObjectURL(url); ok(c.toDataURL('image/jpeg', 0.72)); };
    im.onerror = () => { URL.revokeObjectURL(url); no(new Error('foto')); }; im.src = url;
  });
}

/* ---------- Acciones ---------- */
function salir() { lsSet(LS, null); lsSet(LSC, null); S.ses = null; S.vista = 'hitos'; pintar(); }
function validarForm() {
  const f = S.f, e = {}; f.err = e;
  if (!f.uf) e.uf = 1; if (!f.costado) e.costado = 1;
  if (!abTxt(f.kI, f.mI) || !abTxt(f.kF, f.mF) || [f.kI, f.mI, f.kF, f.mF].some(v => isNaN(num(v)))) e.ab = 1;
  if (!f.act) e.act = 1;
  else { const K = calc(); if (isNaN(K.c) || K.c <= 0 || K.d < 0 || K.d > K.c || !(K.fa > 0)) e.med = 1; }
  if (!f.foto) e.foto = 1;
  const m = []; if (e.uf) m.push('UF'); if (e.costado) m.push('costado'); if (e.ab) m.push('abscisas'); if (e.act) m.push('actividad'); if (e.med) m.push('medidas (cantidad > 0, descuento ≤ cantidad)'); if (e.foto) m.push('foto');
  return m;
}
async function guardar() {
  const f = S.f, falta = validarForm();
  if (falta.length) { aviso('Falta o revisa: ' + falta.join(', ') + '.', 'err'); pintar(); window.scrollTo(0, 0); return; }
  const K = calc(), n = nd();
  const reg = { id: f.id, fecha: S.fecha, hito: S.hito, uf: f.uf, costado: f.costado, abIni: abTxt(f.kI, f.mI), abFin: abTxt(f.kF, f.mF), paquete: paquetesDe(S.hito, f.uf)[f.pq][0], cc: f.act.c, actividad: f.act.d, und: f.act.u, nd: n,
    largo: n >= 1 ? num(f.largo) : '', ancho: n >= 2 ? num(f.ancho) : '', alto: n >= 3 ? num(f.alto) : '', cantidad: K.c, descuento: K.d, factor: K.fa, total: r3(K.t),
    lat: f.gps ? f.gps.lat : '', lon: f.gps ? f.gps.lon : '', prec: f.gps ? f.gps.prec : '', foto: f.foto, obs: f.obs, llave: S.ses.llave, creado: new Date().toISOString().slice(0, 19).replace('T', ' ') };
  f.guardando = true; pintar();
  await DB.poner(reg);               // primero queda guardado en el equipo; luego sube en segundo plano
  S.pend = (await DB.todos()).filter(x => x.llave === S.ses.llave);
  S.f = null; S.vista = 'hito'; aviso('Registro guardado. Se sube en segundo plano.', 'ok'); pintar();
  sincronizar();
}

document.addEventListener('click', async ev => {
  const b = ev.target.closest('[data-a]'); if (!b) return;
  const a = b.dataset.a, v = b.dataset.v; S.msg = a === 'guardar' ? S.msg : '';
  if (a === 'entrar') {
    const k = $('#llave').value.trim(); if (!k) return;
    cargando(true, 'Entrando…');
    try { const r = await llamar({ accion: 'validar', llave: k, app: 'oe' }, 30000); if (r && r.ok) { S.ses = { llave: r.llave || k, nombre: r.nombre }; lsSet(LS, S.ses); await cargarCat(); cargando(false); pintar(); pedirDia(); return; } aviso((r && r.mensaje) || 'Llave no válida', 'err'); }
    catch (e) { aviso('Sin conexión: se necesita señal para entrar la primera vez.', 'err'); }
    cargando(false); pintar(); return;
  }
  if (a === 'dia') { const n = sumDias(S.fecha, Number(v)), hoy = hoyISO(); if (n <= hoy && n >= sumDias(hoy, -3)) { S.fecha = n; S.srv = []; pintar(); pedirDia(); } return; }
  if (a === 'hito') { S.hito = v; S.vista = 'hito'; window.scrollTo(0, 0); pintar(); return; }
  if (a === 'volver') { S.vista = 'hitos'; window.scrollTo(0, 0); pintar(); return; }
  if (a === 'nuevo') { S.f = nuevoForm(); S.q = ''; S.vista = 'form'; window.scrollTo(0, 0); pintar(); tomarGps(); return; }
  if (a === 'cancelar') { if (!S.f.act && !S.f.foto || confirm('¿Descartar este registro?')) { S.f = null; S.vista = 'hito'; pintar(); } return; }
  if (a === 'uf') { S.f.uf = v; S.f.pq = ''; S.f.act = null; S.q = ''; S.f.err.uf = 0; pintar(); return; }
  if (a === 'costado') { S.f.costado = v; S.f.err.costado = 0; pintar(); return; }
  if (a === 'act') { const p = paquetesDe(S.hito, S.f.uf)[S.f.pq], x = p[1].find(y => y[0] === v); S.f.act = { c: x[0], d: x[1], u: x[2] }; S.f.largo = S.f.ancho = S.f.alto = S.f.cant = S.f.desc = ''; S.f.fac = '1'; S.f.err.act = 0; pintar(); window.scrollBy(0, 0); return; }
  if (a === 'cambiarAct') { S.f.act = null; S.q = ''; pintar(); return; }
  if (a === 'gps') { tomarGps(); return; }
  if (a === 'guardar') { guardar(); return; }
  if (a === 'sync') { sincronizar(); return; }
  if (a === 'anular') { if (!confirm('¿Anular este registro?')) return; cargando(true, 'Anulando…'); try { const r = await llamar({ accion: 'oe_eliminar', llave: S.ses.llave, id: v }); if (!r.ok) aviso(r.mensaje || 'No se pudo anular', 'err'); } catch (e) { aviso('Sin conexión: no se pudo anular.', 'err'); } cargando(false); pedirDia(); return; }
});
document.addEventListener('input', ev => {
  const t = ev.target;
  if (t.id === 'buscar') { S.q = t.value; const p = S.f && paquetesDe(S.hito, S.f.uf)[S.f.pq]; pintar(); const n = $('#buscar'); if (n) { n.focus(); n.setSelectionRange(n.value.length, n.value.length); } return; }
  const k = t.dataset && t.dataset.f; if (!k || !S.f) return;
  S.f[k] = t.value;
  if (k === 'pq') { S.f.act = null; S.q = ''; pintar(); return; }
  if (['kI', 'mI', 'kF', 'mF'].includes(k)) S.f.err.ab = 0;
  if (['largo', 'ancho', 'alto', 'cant', 'desc', 'fac'].includes(k)) { const e = $('#tot'); if (e) e.innerHTML = totHtml(calc(), S.f.act ? S.f.act.u : ''); S.f.err.med = 0; }
});
document.addEventListener('change', async ev => {
  const t = ev.target;
  if (t.id === 'fecha') { const hoy = hoyISO(); if (t.value && t.value <= hoy && t.value >= sumDias(hoy, -3)) { S.fecha = t.value; S.srv = []; pintar(); pedirDia(); } else { t.value = S.fecha; } return; }
  if (t.dataset && t.dataset.foto !== undefined && t.files && t.files[0]) { try { S.f.foto = await reducirFoto(t.files[0]); S.f.err.foto = 0; } catch (e) { aviso('No se pudo leer la foto.', 'err'); } pintar(); }
});
$('#bAct').onclick = () => { if (S.ses) sincronizar(); };
$('#bSal').onclick = () => { if (!S.pend.length || confirm('Hay registros sin subir en este equipo. Si sales no se pierden, pero no se subirán hasta que entres de nuevo. ¿Salir?')) salir(); };
window.addEventListener('online', sincronizar);
window.addEventListener('beforeunload', ev => { if (S.f && (S.f.act || S.f.foto)) { ev.preventDefault(); ev.returnValue = ''; } });

(async () => { await cargarCat(); pintar(); if (S.ses) { S.pend = (await DB.todos().catch(() => [])).filter(x => x.llave === S.ses.llave); pintar(); sincronizar(); pedirDia(); } })();
try { if (navigator.onLine) fetch(API, { method: 'POST', body: JSON.stringify({ accion: 'ping' }) }).catch(() => {}); } catch (e) {}
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
