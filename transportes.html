<style>
:root{--ink:#14202b;--hv:#0a7f2e;--navy:#1f2d3d;--paper:#eef0f2;--line:#c9d0d6;--ok:#1f7a3d;--err:#b3261e;--mut:#51606d}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--paper);color:var(--ink);font-size:19px;padding-bottom:30px}
header{background:var(--hv);color:#fff;padding:8px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px;border-bottom:4px solid var(--navy)}
header .logo{height:38px;width:auto;background:#fff;border-radius:6px;padding:2px 4px}
header h1{font-size:18px;margin:0;flex:1}
input.lista{background:#fff url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16'><path d='M3 5l5 6 5-6z' fill='%23555'/></svg>") no-repeat right 12px center;padding-right:36px;cursor:pointer}
#red{font-size:13px;font-weight:700;text-align:right;line-height:1.3}#red .pen{display:inline-block;margin-top:3px;background:#f59e0b;color:#1f2937;border-radius:10px;padding:2px 9px}
.marca{display:block;max-width:240px;width:70%;margin:4px auto 10px}
main{max-width:640px;margin:auto;padding:14px}
h2{font-size:20px;margin:6px 0 4px}
.guia{margin:0 0 12px;color:var(--mut);font-size:15px}
.card{background:#fff;border:1px solid var(--line);border-radius:6px;padding:12px;margin-bottom:12px}
.row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;align-items:flex-end}
.row>*{flex:1;min-width:120px}
label{font-size:16px;color:var(--mut);display:block;margin-bottom:3px}
input,select{width:100%;padding:14px;font-size:20px;border:1px solid #8794a0;border-radius:6px;background:#fff;color:var(--ink)}
input:focus,select:focus,button:focus-visible{outline:3px solid var(--hv);outline-offset:1px}
button{padding:16px 16px;min-height:56px;font-size:19px;font-weight:700;border:0;border-radius:6px;background:var(--ink);color:#fff;width:100%}
button.sec{background:#dde2e6;color:var(--ink)}
button.link{background:none;color:var(--ink);text-decoration:underline;width:auto;padding:4px;font-weight:400;font-size:15px}
.chk{display:flex;align-items:center;gap:10px;font-size:18px;color:var(--ink);margin:0;font-weight:700}
.chk input{width:28px;height:28px}
.malcampo{border:3px solid #b00020!important;background:#fff0f0!important}.malmsg{color:#b00020;font-weight:700;margin-top:4px}
.aviso{padding:10px 12px;border-radius:6px;margin:0 0 12px;font-size:16px;border:1px solid var(--line);background:#fff}
.aviso.ok{border-color:var(--ok);color:var(--ok)}.aviso.err{border-color:var(--err);color:var(--err)}
.off{opacity:.5}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.chip{width:auto;min-width:64px;padding:10px 12px;background:#fff;color:var(--ink);border:2px solid var(--ink);font-weight:600}
.chip.on{background:var(--ink);color:#fff}
.total{margin-top:10px;font-size:19px;font-weight:700}
.n{display:inline-block;background:var(--hv);color:#fff;border-radius:50%;width:30px;height:30px;line-height:30px;text-align:center;font-weight:800;margin-right:6px}
.fotos{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fotos img{width:100%;border-radius:4px;display:block}
.prob{display:flex;gap:8px;align-items:center;justify-content:space-between;margin:6px 0;color:var(--err);font-size:16px}
.prob button{width:auto;padding:8px 12px;font-size:15px}
small{color:var(--mut)}
#barra{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:10px 14px;display:flex;gap:10px}
#barra button{flex:1}
.err-c input,.err-c select{border:3px solid var(--err);background:#fdecea}
.err-c label{color:var(--err);font-weight:700}
.err-c .chip{border-color:var(--err)}
.card.err-c{border:3px solid var(--err);background:#fdecea}
.msgerr{color:var(--err);font-weight:700;display:block;margin-top:3px}
.req{color:var(--err)}
.li{display:flex;gap:8px;align-items:center;justify-content:space-between;border-top:1px solid var(--line);padding:10px 0;flex-wrap:wrap}
.li b{display:block}
.tag{font-size:12px;color:#fff;background:var(--mut);border-radius:4px;padding:2px 6px;margin-left:6px}
.tag.hoy{background:var(--ok)}.tag.pend{background:#b36b00}
.li button{width:auto;padding:10px 12px;font-size:15px}
button.verde{background:var(--hv)}
button.grande{background:var(--hv);font-size:24px;padding:22px 16px;min-height:76px;border-radius:12px;box-shadow:0 3px 0 #06551e}
button.rojo{background:#fff;color:var(--err);border:2px solid var(--err)}
h3{font-size:21px;margin:0 0 10px}
.paso{border-left:6px solid var(--hv)}
input.placa{font-size:32px;font-weight:800;text-align:center;letter-spacing:3px;text-transform:uppercase}
input.cant{font-size:28px;font-weight:800;text-align:center}
.resumen{background:#e8f5ec;border:2px solid var(--ok);border-radius:8px;padding:10px 12px;margin-top:8px;font-size:18px}
details.mas{background:#fff;border:1px solid var(--line);border-radius:6px;padding:12px;margin-bottom:12px}
details.mas summary{font-size:19px;font-weight:700;cursor:pointer;padding:6px 0}
.viaje{background:#fff;border:1px solid var(--line);border-left:6px solid var(--hv);border-radius:8px;padding:12px;margin-bottom:10px}
.viaje.falta{border-left-color:#b36b00}
.viaje .t{font-size:22px;font-weight:800}
.viaje .s{font-size:16px;color:var(--mut);margin:2px 0 8px}
.viaje .bs{display:flex;gap:8px;flex-wrap:wrap}
.viaje .bs>*{flex:1;min-width:110px}
.viaje .bs button{padding:12px 10px;font-size:17px;min-height:48px}
.hecho{font-size:64px;text-align:center;margin:0}
.gr{display:flex;flex-direction:column;gap:10px}
[hidden]{display:none!important}
.bs{display:flex;gap:8px;flex-wrap:wrap}
.bs button{flex:1;min-width:130px}
.fotos>div{position:relative}
.fotos .x{position:absolute;top:4px;right:4px;width:auto;min-height:0;padding:4px 12px;font-size:18px;border-radius:20px}
.sub{color:var(--mut);font-size:15px;margin:-4px 0 10px}
#form label{font-size:18px;font-weight:700}#form input,#form select{font-size:20px;padding:14px}#form .card h3{font-size:22px}#form .grande{font-size:24px;padding:20px}
</style>
</head>
<body>
<header><img class="logo" src="marca.png" alt="Consorcio Constructor Sabana Norte"><h1>Registro de transportes</h1><span id="red"></span></header>
<main>
  <div id="aviso" class="aviso" hidden></div>
  <section id="login" class="card" hidden>
    <img class="marca" src="logo.png" alt="Consorcio Constructor Sabana Norte">
    <label for="llave" style="font-size:20px;color:var(--ink)">🔑 Escribe tu llave</label>
    <input id="llave" type="text" autocapitalize="characters" autocomplete="off">
    <div class="row"><button id="btnIngresar" class="grande">Entrar</button></div>
    <p><small>La primera vez necesitas señal. Después funciona sin internet.</small></p>
  </section>
  <section id="inicio" hidden></section>
  <section id="dia" hidden></section>
  <section id="form" hidden></section>
  <section id="listo" hidden></section>
  <section id="visor" hidden></section>
</main>
<datalist id="dl-placa"></datalist><datalist id="dl-material"></datalist><datalist id="dl-origen"></datalist><datalist id="dl-destino"></datalist><datalist id="dl-centro"></datalist><datalist id="dl-tipo"></datalist><datalist id="dl-empresa"></datalist>
<script src="vendor/jspdf.umd.min.js"></script>
<script src="pdf_tr.js"></script>
<script>
'use strict';
const API = 'https://script.google.com/macros/s/AKfycbz6LjPHWbh_vLcYhwSvYFp8tMN737nX-hJUPiX6vOvLb_3tEAyH9zeCC_4pqNSPRz9O1w/exec';
const $ = id => document.getElementById(id);
const hoy = () => new Date().toLocaleDateString('sv-SE');
const hm = () => new Date().toLocaleTimeString('sv-SE', { hour: '2-digit', minute: '2-digit' });
const sumDias = (f, n) => { const d = new Date(f + 'T12:00:00'); d.setDate(d.getDate() + n); return d.toLocaleDateString('sv-SE'); };
const fmtF = f => { const p = String(f).split('-'); return p.length === 3 ? p[2] + '/' + p[1] + '/' + p[0] : f; };
const num = v => { const x = Number(String(v === undefined || v === null ? '' : v).trim().replace(',', '.')); return (String(v).trim() === '' || !isFinite(x)) ? NaN : x; };
const r2 = x => Math.round(x * 100) / 100;
function h(tag, props, ...kids) {
  const e = document.createElement(tag);
  for (const k in (props || {})) {
    const v = props[k];
    if (k === 'class') e.className = v;
    else if (k.slice(0, 2) === 'on') e[k] = v;
    else if (k === 'value') e.value = v;
    else if (v !== false && v !== null && v !== undefined) e.setAttribute(k, v);
  }
  kids.flat().forEach(c => { if (c === null || c === undefined || c === false) return; e.appendChild(typeof c === 'object' ? c : document.createTextNode(String(c))); });
  return e;
}
function aviso(t, c, quieto) { const a = $('aviso'); a.textContent = t || ''; a.className = 'aviso ' + (c || ''); a.hidden = !t; if (t && !quieto) window.scrollTo(0, 0); }
function pantalla(id) { ['login', 'inicio', 'dia', 'form', 'listo', 'visor'].forEach(i => $(i).hidden = i !== id); window.scrollTo(0, 0); }

/* ---------- almacenamiento en el telefono ---------- */
const kv = (() => {
  let dbp;
  const open = () => dbp || (dbp = new Promise((res, rej) => { const r = indexedDB.open('transportes', 1); r.onupgradeneeded = () => r.result.createObjectStore('kv'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }));
  const tx = async (modo, fn) => { const db = await open(); return new Promise((res, rej) => { const t = db.transaction('kv', modo); const rq = fn(t.objectStore('kv')); t.oncomplete = () => res(rq && rq.result); t.onerror = () => rej(t.error); }); };
  const LS = 'tr_user';
  const lsGet = () => { try { return JSON.parse(localStorage.getItem(LS)); } catch (e) { return null; } };
  const lsSet = v => { try { if (v == null) localStorage.removeItem(LS); else localStorage.setItem(LS, JSON.stringify(v)); } catch (e) {} };
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
  return {
    get: async k => { let v; try { v = await tx('readonly', s => s.get(k)); } catch (e) { if (k !== 'user') throw e; } if (k === 'user' && !v) { v = lsGet(); if (v) { try { await tx('readwrite', s => s.put(v, k)); } catch (e) {} } } return v; },
    set: async (k, v) => { if (k === 'user') lsSet(v); return tx('readwrite', s => s.put(v, k)); },
    limpiar: async () => tx('readwrite', st => st.clear()),
    del: async k => { if (k === 'user') lsSet(null); return tx('readwrite', s => s.delete(k)); }
  };
})();

async function api(d, ms) {
  const ctrl = new AbortController(); const t = setTimeout(() => ctrl.abort(), ms || 60000);
  try { const r = await fetch(API, { method: 'POST', body: JSON.stringify(d), signal: ctrl.signal }); return await r.json(); } finally { clearTimeout(t); }
}

/* ---------- estado ---------- */
let user = null, DATOS = { volquetas: [], catalogos: { MATERIAL: [], ORIGEN: [], DESTINO: [], CENTRO_COSTOS: [] }, planillas: [] }, VIAJES = [], COLA = [];
let sincronizando = false, otraVez = false;
let GEN = 0;
const guardarViajes = () => { GEN++; return kv.set('viajes_' + user.llave, VIAJES); };
const guardarCola = () => kv.set('cola', COLA);
const guardarDatos = () => kv.set('datos', DATOS);
const puedeEditar = v => v.fecha === hoy() || v.registrado === hoy();
const puedeRecibo = v => hoy() <= sumDias(v.fecha, 1);

const ALF = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
function nuevoCod() {
  const a = new Uint8Array(5); crypto.getRandomValues(a);
  let s = ''; a.forEach(b => s += ALF[b % 32]);
  const cod = 'VT-' + hoy().slice(2).replace(/-/g, '') + '-' + s;
  return VIAJES.some(v => v.cod === cod) ? nuevoCod() : cod;
}

/* ---------- ingreso ---------- */
async function cargarLocal() {
  try { if (localStorage.getItem('tr_reset') !== 'v51') { await kv.limpiar(); await kv.set('user', user); localStorage.setItem('tr_reset', 'v51'); } } catch (e) {} // limpieza única: borra viajes/cola de pruebas guardados en el celular
  const d = await kv.get('datos'); if (d) DATOS = d;
  aplicarSitios();
  VIAJES = (await kv.get('viajes_' + user.llave)) || [];
  COLA = (await kv.get('cola')) || [];
}
try { if (navigator.onLine) fetch(API, { method: 'POST', body: JSON.stringify({ accion: 'ping' }) }).catch(() => {}); } catch (e) {} // despierta el servidor mientras se escribe la llave
async function ingresar() {
  const l = $('llave').value.trim();
  if (!l) { aviso('Escribe tu llave.', 'err'); return; }
  if (!navigator.onLine) { aviso('La primera vez necesitas señal.', 'err'); return; }
  aviso('Entrando…');
  try {
    const r = await api({ accion: 'validar', llave: l, app: 'transportes' }, 30000);
    if (!r.ok) { aviso(r.admin ? 'Las llaves de administrador no registran viajes. Usa el dashboard.' : (r.mensaje || 'Llave no válida'), 'err'); return; }
    user = { llave: r.llave, nombre: r.nombre }; ULT_REF = 0;
    await kv.set('user', user);
    await cargarLocal();
    aviso('');
    abrirInicio();
    sincronizar();
  } catch (e) { aviso('No se pudo conectar. Intenta de nuevo.', 'err'); }
}
async function aplicarServidor(r) {
  DATOS = { volquetas: r.volquetas || [], catalogos: r.catalogos || DATOS.catalogos, planillas: r.planillas || [], sitios: r.sitios || DATOS.sitios || [], ufs: r.ufs || DATOS.ufs || [], dist: r.dist || DATOS.dist || [] };
  aplicarSitios();
  await guardarDatos();
  const pend = new Set(COLA.filter(o => o.llave === user.llave).map(o => o.cod));
  const locales = VIAJES.filter(v => pend.has(v.cod));
  const nuevos = (r.viajes || []).filter(v => !pend.has(v.cod)).map(v => Object.assign(v, { llave: user.llave }));
  VIAJES = nuevos.concat(locales);
  await guardarViajes();
}
let ULT_REF = 0; // evita pedir al servidor la lista completa cada vez que se abre el inicio (máx. 1 vez cada 45 s)
async function refrescar(forzar) {
  if (!user || !navigator.onLine || sincronizando || COLA.some(o => !o.error)) return;
  if (!forzar && Date.now() - ULT_REF < 45000) return;
  const g = GEN;
  try {
    const r = await api({ accion: 'tr_ingresar', llave: user.llave }, 20000);
    if (g !== GEN || sincronizando || COLA.some(o => !o.error)) return;
    if (r.ok) { ULT_REF = Date.now(); await aplicarServidor(r); if (!$('inicio').hidden) pintarInicio(); else if (!$('dia').hidden && diaActual) abrirDia(diaActual); }
    else if (/no v[aá]lida/i.test(r.mensaje || '')) { await cerrarSesion(r.mensaje); }
  } catch (e) {}
}
async function cerrarSesion(msg) {
  if (!msg && COLA.length && !confirm('Hay ' + COLA.length + ' cambio(s) sin enviar. Se enviarán cuando haya señal. ¿Cerrar sesión?')) return;
  await kv.del('user'); user = null; VIAJES = [];
  $('llave').value = ''; pantalla('login'); aviso(msg || '', msg ? 'err' : '');
}

/* ---------- inicio ---------- */
let diaActual = null;
function volver() { if (diaActual) abrirDia(diaActual); else abrirInicio(); }
function abrirInicio() { diaActual = null; aviso(''); pintarInicio(); pantalla('inicio'); refrescar(); }
function ultimoViaje() { return VIAJES.slice().sort((a, b) => (b.fecha + (b.hora_salida || '') + b.cod).localeCompare(a.fecha + (a.hora_salida || '') + a.cod))[0]; }
function pintarInicio() {
  const B = $('inicio'); B.textContent = '';
  const hoyV = VIAJES.filter(v => v.fecha === hoy()).sort((a, b) => String(a.hora_salida || '').localeCompare(String(b.hora_salida || '')) || a.cod.localeCompare(b.cod));
  const vol = hoyV.reduce((s, v) => s + (isNaN(num(v.cant)) ? 0 : num(v.cant)), 0);
  B.appendChild(h('div', { style: 'margin:0 0 12px' }, h('div', { style: 'font-size:24px;font-weight:800' }, '👋 Hola, ' + user.nombre), h('small', {}, fmtF(hoy()))));
  B.appendChild(h('div', { class: 'gr', style: 'margin-bottom:14px' },
    h('button', { class: 'grande', onclick: () => abrirForm(null) }, '➕ NUEVO VIAJE'),
    ultimoViaje() ? h('button', { class: 'sec', onclick: () => abrirForm(null, ultimoViaje()) }, '🔁 Repetir el último viaje (' + ultimoViaje().placa + ')') : null));
  // recibos pendientes de ayer
  const ayer = sumDias(hoy(), -1);
  const faltan = VIAJES.filter(v => v.fecha === ayer && !v.tiene_recibo && puedeRecibo(v));
  if (faltan.length) { B.appendChild(h('h3', {}, '📷 Falta la foto del recibo (ayer)')); faltan.forEach(v => B.appendChild(filaViaje(v))); }
  B.appendChild(h('h3', { style: 'margin-top:14px' }, 'Viajes de hoy' + (hoyV.length ? ' · ' + hoyV.length + ' · ' + r2(vol) + ' m³' : '')));
  if (!hoyV.length) B.appendChild(h('div', { class: 'card' }, 'Aún no hay viajes hoy. Toca el botón verde para empezar.'));
  hoyV.forEach(v => B.appendChild(filaViaje(v)));
  if (hoyV.length) B.appendChild(h('button', { class: 'sec', style: 'margin-bottom:14px', onclick: () => planilla(hoy()) }, '📄 Planilla de hoy'));
  const dias = {}; VIAJES.forEach(v => { if (v.fecha !== hoy()) (dias[v.fecha] = dias[v.fecha] || []).push(v); });
  const ks = Object.keys(dias).sort().reverse();
  if (ks.length) {
    const card = h('div', { class: 'card' }, h('b', {}, 'Días anteriores'));
    ks.forEach(f => {
      const vs = dias[f], v2 = vs.reduce((s, v) => s + (isNaN(num(v.cant)) ? 0 : num(v.cant)), 0);
      card.appendChild(h('div', { class: 'li' }, h('div', {}, h('b', {}, fmtF(f)), h('small', {}, vs.length + ' viaje(s) · ' + r2(v2) + ' m³')),
        h('div', { style: 'display:flex;gap:6px;flex-wrap:wrap' }, h('button', { onclick: () => abrirDia(f) }, 'Abrir'), h('button', { class: 'sec', onclick: () => planilla(f) }, '📄 Planilla'))));
    });
    B.appendChild(card);
  }
  B.appendChild(h('div', { style: 'text-align:center;margin-top:10px' }, h('button', { class: 'link', onclick: () => cerrarSesion() }, 'Cerrar sesión (cambiar llave)')));
}

/* ---------- dia anterior: lista de viajes ---------- */
function abrirDia(f) {
  diaActual = f; aviso('');
  const D = $('dia'); D.textContent = '';
  const vs = VIAJES.filter(v => v.fecha === f).sort((a, b) => String(a.hora_salida || '').localeCompare(String(b.hora_salida || '')) || a.cod.localeCompare(b.cod));
  D.appendChild(h('div', { class: 'gr', style: 'margin-bottom:12px' }, h('button', { class: 'sec', style: 'font-size:20px;padding:14px;background:#12202b;color:#fff;border:0;box-shadow:0 2px 6px rgba(0,0,0,.35)', onclick: abrirInicio }, '← VOLVER AL INICIO'),
    h('h3', { style: 'margin:6px 0 0' }, fmtF(f) + (f === hoy() ? ' (hoy)' : '')),
    h('small', {}, puedeRecibo({ fecha: f }) ? 'Este día ya cerró. Aún puedes subir la foto del recibo.' : 'Este día ya cerró.'),
    h('button', { class: 'verde', onclick: () => planilla(f) }, '📄 Planilla del día')));
  if (!vs.length) D.appendChild(h('div', { class: 'card' }, 'No hay viajes este día.'));
  vs.forEach(v => D.appendChild(filaViaje(v)));
  pantalla('dia');
}
function filaViaje(v) {
  const op = COLA.find(o => o.cod === v.cod && o.error);
  const pend = COLA.some(o => o.cod === v.cod && !o.error);
  const falta = !v.tiene_recibo && puedeRecibo(v);
  const mas = h('div', { class: 'bs', hidden: true, style: 'margin-top:8px' });
  if (puedeEditar(v)) { mas.appendChild(h('button', { class: 'sec', onclick: () => abrirForm(v) }, '✏️ Corregir')); }
  if (v.tiene_carga) mas.appendChild(h('button', { class: 'sec', onclick: () => verFoto(v, 'carga') }, '🖼 Ver fotos de carga'));

  VIAJES = VIAJES.filter(x => x.cod !== v.cod);
  await kv.del('f_' + v.cod + '_c'); await kv.del('f_' + v.cod + '_r');
  await guardarViajes(); await guardarCola();
  volver(); sincronizar();
}

/* ---------- PDF: vale y planilla ---------- */
let LOGO = null;
async function cargarLogo() {
  if (LOGO) return LOGO;
  try {
    const b = await (await fetch('logo.png')).blob();
    const data = await new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => res(fr.result); fr.onerror = rej; fr.readAsDataURL(b); });
    const dim = await new Promise(res => { const i = new Image(); i.onload = () => res({ w: i.naturalWidth, h: i.naturalHeight }); i.onerror = () => res({ w: 420, h: 326 }); i.src = data; });
    LOGO = { data: data, w: dim.w, h: dim.h };
  } catch (e) { LOGO = null; }
  return LOGO;
}
function bajar(blob, nombre) {
  const u = URL.createObjectURL(blob); const a = h('a', { href: u, download: nombre }); document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(u), 60000);
}
async function entregarPdf(doc, nombre, titulo) {
  const blob = doc.output('blob');
  const file = new File([blob], nombre, { type: 'application/pdf' });
  try { if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: titulo }); return; } } catch (e) { if (e && e.name === 'AbortError') return; }
  bajar(blob, nombre);
}
async function compartirVale(v) {
  try { const doc = PDT.generarVale(v, { nombre: user.nombre }, window.jspdf.jsPDF, await cargarLogo()); await entregarPdf(doc, 'Vale_' + v.cod + '.pdf', 'Vale ' + v.cod); }
  catch (e) { console.error(e); aviso('No se pudo crear el PDF del vale.', 'err'); }
}
async function planilla(f) {
  const vs = VIAJES.filter(v => v.fecha === f);
  if (!vs.length) { aviso('Ese día no tiene viajes.', 'err'); return; }
  aviso('Generando planilla…');
  try {
    const doc = PDT.generarPlanilla(f, vs, { nombre: user.nombre }, window.jspdf.jsPDF, await cargarLogo());
    const nombre = 'Planilla_viajes_' + user.llave + '_' + f + '.pdf';
    let msg = '';
    if (navigator.onLine && !COLA.some(o => o.llave === user.llave && o.t === 'g')) {
      try { const r = await api({ accion: 'tr_planilla', llave: user.llave, fecha: f, pdf: doc.output('datauristring').split(',')[1] }, 60000); msg = r.ok ? ' Copia guardada en la oficina.' : ''; } catch (e) {}
    } else if (COLA.some(o => o.llave === user.llave && o.t === 'g')) msg = ' Hay viajes sin enviar: la copia de la oficina se guarda cuando todo esté enviado.';
    aviso('Planilla lista.' + msg, 'ok');
    await entregarPdf(doc, nombre, 'Planilla de viajes ' + fmtF(f));
  } catch (e) { console.error(e); aviso('No se pudo crear la planilla.', 'err'); }
}

/* ---------- sincronizacion ---------- */
async function renombrar(op, nuevo) {
  const viejo = op.cod;
  for (const s of ['c', 'r']) { const d = await kv.get('f_' + viejo + '_' + s); if (d) { await kv.set('f_' + nuevo + '_' + s, d); await kv.del('f_' + viejo + '_' + s); } }
  COLA.forEach(o => { if (o.cod === viejo) { o.cod = nuevo; if (o.viaje) o.viaje.cod = nuevo; } });
  VIAJES.forEach(v => { if (v.cod === viejo) v.cod = nuevo; });
  await guardarViajes(); await guardarCola();
}
async function sincronizar() {
  if (sincronizando) { otraVez = true; return; }
  if (!COLA.some(o => !o.error) || !navigator.onLine) return;
  sincronizando = true;
  try {
    for (const op of COLA.slice()) {
      if (op.error || !COLA.includes(op)) continue;
      let r;
      if (op.t === 'g') {
        const viaje = Object.assign({}, op.viaje, { ed: op.ed });
        if (op.fotoNueva) viaje.foto_carga = asArr(await kv.get('f_' + op.cod + '_c'));
        delete viaje.nuevo; delete viaje.llave;
        r = await api({ accion: 'tr_guardar', llave: op.llave, viaje: viaje });
        if (!r.ok && r.codigo === 'DUP') { await renombrar(op, nuevoCod()); continue; }
      } else if (op.t === 'r') {
        const foto = await kv.get('f_' + op.cod + '_r');
        if (!asArr(foto).length) { COLA = COLA.filter(o => o !== op); await guardarCola(); continue; }
        r = await api({ accion: 'tr_recibo', llave: op.llave, cod: op.cod, foto: foto });
      } else r = await api({ accion: 'tr_eliminar', llave: op.llave, cod: op.cod });
      if (!r.ok) { op.error = r.mensaje || 'La oficina no aceptó el cambio'; await guardarCola(); continue; }
      const vigente = COLA.find(o => o.t === op.t && o.cod === op.cod);
      if (vigente && vigente.id === op.id) COLA = COLA.filter(o => o !== op);
      const v = VIAJES.find(x => x.cod === op.cod);
      if (op.t === 'g' && v && vigente && vigente.id === op.id) { v.nuevo = false; v.tiene_carga = !!r.tiene_carga || v.tiene_carga; v.alertas = (r.alertas || []).join('; '); if (op.fotoNueva) await kv.del('f_' + op.cod + '_c'); }
      if (op.t === 'r') await kv.del('f_' + op.cod + '_r');
      await guardarViajes(); await guardarCola();
    }
  } catch (e) {}
  finally {
    sincronizando = false;
    if (user) { if (!$('inicio').hidden) pintarInicio(); else if (!$('dia').hidden && diaActual) abrirDia(diaActual); }
    if (otraVez) { otraVez = false; setTimeout(sincronizar, 300); } else refrescar(true);
  }
}

/* ---------- arranque ---------- */
async function estadoRed() {
  let n = 0; try { const c = (await kv.get('cola')) || []; n = c.filter(o => !user || o.llave === user.llave).length; } catch (x) {}
  const r = $('red'); r.textContent = navigator.onLine ? 'Con señal' : 'Sin señal';
  if (n) { const b = document.createElement('div'); b.className = 'pen'; b.textContent = '⏳ ' + n + (n === 1 ? ' pendiente de enviar' : ' pendientes de enviar'); r.appendChild(b); }
}
setInterval(estadoRed, 3000);
$('btnIngresar').onclick = ingresar;
$('llave').onkeydown = e => { if (e.key === 'Enter') ingresar(); };
window.addEventListener('online', () => { estadoRed(); sincronizar(); refrescar(true); });
window.addEventListener('offline', estadoRed);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && user && !$('inicio').hidden) { pintarInicio(); refrescar(); } });
estadoRed();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
(async () => {
  try { user = await kv.get('user'); } catch (e) { user = null; }
  if (user) { await cargarLocal(); abrirInicio(); sincronizar(); } else pantalla('login');
})();
